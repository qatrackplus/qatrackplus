# ==========================================================================
# Translation catalogues
# ==========================================================================
#
# Two files per locale per domain: the .po a translator edits, and the .mo
# Django actually reads. Nothing recompiles the second from the first
# automatically, and the repository tracks both, so they drift - which is how
# the Spanish catalogue spent a year serving 150 translations its .po had
# never contained.
#
# `--ignore` matters more than it looks. compilemessages walks the whole tree
# from the working directory, so without it the command descends into .venv
# and recompiles every locale of every installed package, then fails on the
# first one of those with a format error - reporting a problem in a
# third-party catalogue as though it were ours.
#
# `compile-messages` needs msgfmt from gettext on PATH. It is present on a
# normal Linux or Windows dev machine; it is *not* in the Docker runtime
# image, which is why the committed .mo has to stay correct.

[tasks.compile-messages]
help = "Compile every locale's .po into the .mo Django reads"
cmd = "python manage.py compilemessages --ignore=.venv --ignore=node_modules"

[tasks.extract-messages]
help = "Re-scan the source for translatable strings and update every .po"
cmd = """
python manage.py makemessages
  --all
  --ignore=.venv
  --ignore=node_modules
  --ignore=docs
"""

# The .po is the source of truth and the .mo is derived from it, so extract
# then compile. Run this after adding or changing a translatable string.
# `update-messages`, not `messages`: every other composite says what it does
# (`ci`, `dev-reset`, `test-order`), and a bare noun reads like a thing rather
# than an action.
[tasks.update-messages]
help = "Re-extract translatable strings, then recompile the catalogues"
sequence = ["extract-messages", "compile-messages"]

# Answers "are the committed .mo files the ones these .po files produce, and
# how much of each language actually reaches users?" - without writing
# anything.
#
# `python manage.py check` was wrong for this, and wrong in the way that
# matters: qatrack.W010 is a *Warning*, and `check` exits 0 for warnings. So
# the task printed the problem and reported success, which is worse than not
# having it - a green `poe ci` meant nothing about the catalogues. @nsmela
# reproduced it on #868 by making fr/django.po stale.
#
# `check_translations` is the right command. It exits 1 when a .mo is out of
# date or a configured language has no catalogue at all, and it computes
# coverage in Python from the .po files, so it needs no msgfmt and does not
# depend on the locale. W010 stays a system check for staleness - silent when
# healthy - and this is the task that can fail.
[tasks.check-messages]
help = "Report stale .mo files and per-language coverage, and fail if anything is wrong"
cmd = "python manage.py check_translations"
