# Included from pyproject.toml's [tool.poe] include list - see the header
# comment there for the overall poe/Makefile migration context.

# ==========================================================================
# Data
# ==========================================================================


# `dump-data`, not `dumpdata`: the Django management command is called
# `dumpdata`, and a task names the job rather than the command behind it - the
# same reason `delete-all-data` below is not called `flushdb`.
[tasks.dump-data]
help = "Dump the full DB to a timestamped JSON fixture"
interpreter = "python"
shell = """
import datetime, subprocess, sys

stamp = datetime.datetime.now().strftime('%Y-%m-%d_%H-%M-%S')
out = f'qatrack-dump-{stamp}.json'
print(f'writing {out}')
sys.exit(subprocess.call([
    sys.executable, 'manage.py', 'dumpdata', '-v1', '--indent=2',
    '--natural-foreign', '--natural-primary', '--output', out,
]))
"""


[tasks.delete-all-data]
help = "DESTRUCTIVE: empty every table (manage.py flush) - schema and migrations stay"
# The only surviving task here that deletes anything, and it does not mirror a
# Makefile target - `make flushdb`, which it would have mirrored, is removed on
# develop as one of three destructive targets that should never have shipped in
# a checkout that doubles as a deployment.
#
# It is kept because it is the one honest version of the job. `make flushdb`
# ran
#
#     python manage.py sqlflush | python manage.py dbshell
#
# which is broken in practice: `dbshell` execs the database's own client
# binary, so on sqlite it needs the `sqlite3` CLI on PATH. Without it the
# pipeline dies, and - because the failure happens in the *consumer* - what
# the developer sees is a BrokenPipeError traceback out of the producer,
# not Django's actual "You appear not to have the 'sqlite3' program
# installed" message. Confirmed on this machine, where sqlite3 is absent.
#
# `manage.py flush` is Django's own built-in for this and needs no external
# binary, so it works on every backend and every platform, with no pipe and
# therefore no shell. Behaviour differs slightly and for the better: flush
# also resets sequences and re-runs post-migrate handlers.
cmd = "python manage.py flush --noinput"


# A database that looks like a working clinic, for developing a feature or
# reviewing someone else's pull request against something other than empty
# tables. The guide's *Generating Sample Data* section describes what it builds.
#
# `--no-input` is deliberately NOT exposed. The underlying command prompts
# before clearing, and this file's header says nothing here should be a shorter
# way to do something irreversible than doing it by hand - so the one flag that
# turns the confirmation off is the one flag a task should not hand you. Reach
# for `python manage.py generate_sample_data --clear --no-input` yourself if you
# mean it, in a script where you have thought about it.
[tasks.generate-sample-data]
help = "Generate realistic sample data: poe generate-sample-data [--days N] [--clear]; --clear is DESTRUCTIVE"
interpreter = "python"
shell = """
import os
import subprocess
import sys

argv = [sys.executable, 'manage.py', 'generate_sample_data']

days = (os.environ.get('days') or '').strip()
if days:
    argv += ['--days', days]

clearing = bool(os.environ.get('clear'))
if clearing:
    argv.append('--clear')

print('%s %s days of sample data%s' % (
    'Clearing, then generating' if clearing else 'Generating',
    days or '90 (the default)',
    ' - the command will ask you to confirm the clear' if clearing else '',
))
sys.stdout.flush()
sys.exit(subprocess.run(argv).returncode)
"""

[[tasks.generate-sample-data.args]]
name = "days"
options = ["--days"]
help = "Days of rolling QA and maintenance history to generate (the command's own default is 90)"

[[tasks.generate-sample-data.args]]
name = "clear"
options = ["--clear"]
type = "boolean"
help = "DESTRUCTIVE: delete existing QA, unit, service log, fault, parts and report data first. You will be asked to confirm"
