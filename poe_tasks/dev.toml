# Included from pyproject.toml's [tool.poe] include list - see the header
# comment there for the overall poe/Makefile migration context.

# ==========================================================================
# Development environment
# ==========================================================================


# dev-init refuses to touch an environment that already exists, rather than
# copying what it can and failing partway through on `That username is already
# taken`. Half a setup and a confusing error is the worst of the options. If
# you want the old one gone, say so explicitly with dev-reset.
[tasks.dev-init]
help = "Create a fresh sqlite dev environment - refuses if one already exists"
interpreter = "python"
shell = """
import os, pathlib, shutil, subprocess, sys

TEMPLATES = [
    ('deploy/dev/local_settings.dev.py', 'qatrack/local_settings.py'),
    ('deploy/dev/local_test_settings.sqlite.py', 'qatrack/local_test_settings.py'),
    ('deploy/dev/local_test_settings.memory.py', 'qatrack/local_test_settings.memory.py'),
]
DB = pathlib.Path('db/default.db')

# Check everything before doing anything.
existing = [dst for _, dst in TEMPLATES if pathlib.Path(dst).exists()]
if DB.exists():
    existing.append(str(DB))

if existing:
    print('This already looks like a set up dev environment:')
    for path in existing:
        print(f'  {path}')
    print()
    print('dev-init will not write over any of it. Either remove what you do not')
    print('want and run this again, or use `poe dev-reset` to discard all of it')
    print('and start over.')
    sys.exit(1)

created = []
for src, dst in TEMPLATES:
    shutil.copyfile(src, dst)
    created.append(pathlib.Path(dst))
    print(f'created {dst} from {src}')

pathlib.Path('db').mkdir(exist_ok=True)


# Put the tree back, so a failed run can simply be run again. Without this, a
# `migrate` that fails leaves the three settings files and the half-made
# database behind, and the next `dev-init` refuses with 'This already looks
# like a set up dev environment' - precisely the state this task exists to get
# you out of. The developer is then deleting files by hand, or reaching for
# `dev-reset`, to recover from a task that did nothing but fail.
#
# Only this run's files are removed. Every path here was checked as absent
# above, before anything was written, so none of it can predate this
# invocation. `db/` itself stays: mkdir(exist_ok=True) may have found it
# already there, and an empty directory is not worth guessing about.
#
# Comments rather than a docstring, like every other body in poe_tasks/: a
# triple-quoted string here would close the TOML string the body lives in.
# That is the third instance of this class of trap in one sitting, after the
# newline-escape one @nsmela found - an argument for his suggestion of
# moving these bodies into a real module.
def undo():
    for path in created:
        path.unlink(missing_ok=True)
    DB.unlink(missing_ok=True)
    print()
    print('removed what this run created - fix the problem above and run')
    print('`poe dev-init` again.')


def run(*args, env=None):
    result = subprocess.call([sys.executable, 'manage.py', *args],
                             env={**os.environ, **(env or {})})
    if result != 0:
        undo()
        sys.exit(result)

run('migrate')
run('createcachetable')
run('createsuperuser', '--noinput', env={
    'DJANGO_SUPERUSER_USERNAME': 'superuser',
    'DJANGO_SUPERUSER_PASSWORD': 'superuser',
    'DJANGO_SUPERUSER_EMAIL': 'superuser@example.com',
})
print('dev environment ready - log in as superuser / superuser')
"""


# Private: removing the dev environment and stopping there is not something
# anybody sets out to do - `dev-reset` is the job, and it is named for being
# destructive. poe 0.49.0 hides `_` tasks from the list and refuses to run one
# directly, so this is a real boundary rather than a convention.
[tasks._dev-clean]
help = "Remove the dev settings files and sqlite database, leaving nothing behind"
interpreter = "python"
shell = """
import pathlib

for path in [
    'qatrack/local_settings.py',
    'qatrack/local_test_settings.py',
    'qatrack/local_test_settings.memory.py',
    'db/default.db',
]:
    target = pathlib.Path(path)
    if target.exists():
        target.unlink()
        print(f'removed {path}')
"""


[tasks.dev-reset]
help = "DESTRUCTIVE: delete your dev settings and sqlite database, then set up a fresh one"
sequence = ["_dev-clean", "dev-init"]


[tasks.run]
help = "Run the dev server"
cmd = "python ./manage.py runserver"
