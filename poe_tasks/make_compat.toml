# Included from pyproject.toml's [tool.poe] include list - see the header
# comment there for the overall poe/Makefile migration context.

# ==========================================================================
# Makefile analogs - kept so existing habits keep working
#
# These exist only so that someone who types `make <target>` out of habit finds
# the same thing under poe. They have an end: when the Makefile is retired,
# this whole block goes with it in the same change. Nothing new should be added
# here - a new task belongs in one of the groups above, and gets a Makefile
# target only if the Makefile still exists.
#
# Every engine and integration analog is a `ref` and carries no logic of its
# own. It used to: `make-test-integration` had its own shell copy of the
# provisioning sequence, and the five engine tasks shared a `_test-engine`
# shell task. Both copies had drifted from the tasks they mirrored, and the
# drift was the dangerous kind - neither refused to overwrite a backup left by
# a killed run, so running one of them after an interruption destroyed the
# developer's database or settings. @nsmela reproduced both end to end on #868.
# A `ref` cannot drift.
# ==========================================================================

[tasks.make-docs]
help = "Makefile analog of `docs` - runs `cd docs && make html`, so needs make"
shell = '''
cd docs && make html
'''


[tasks.make-dumpdata]
help = "Makefile analog of `dumpdata` - shell based"
shell = '''
python manage.py dumpdata -v1 --indent=2 --natural-foreign --natural-primary --output qatrack-dump-$(date '+%Y-%m-%d_%H-%M-%S').json
'''


[tasks.make-test-sqlite]
help = "Makefile analog of `test-engine sqlite`"
ref = "test-engine sqlite"


[tasks.make-test-memory]
help = "Makefile analog of `test-engine memory`"
ref = "test-engine memory"


[tasks.make-test-postgres]
help = "WIP- Makefile analog of `test-engine postgres` - needs a postgres server; unverified here"
ref = "test-engine postgres"


[tasks.make-test-mysql]
help = "WIP- Makefile analog of `test-engine mysql` - needs a mysql server; unverified here"
ref = "test-engine mysql"


[tasks.make-test-mssql]
help = "WIP- Makefile analog of `test-engine mssql` - needs a SQL Server; unverified here"
ref = "test-engine mssql"


[tasks.make-test-integration]
help = "Makefile analog of `test-integration`"
ref = "test-integration"
