# Included from pyproject.toml's [tool.poe] include list - see the header
# comment there for the overall poe/Makefile migration context.

# ==========================================================================
# Tests
# ==========================================================================


[tasks.test]
help = "Run the suite (GUI/Selenium tests skipped by default - pass --run-selenium to include them)"
cmd = "pytest"

# `test-order` is the local half of
# `.github/workflows/order-independence.yml`, and `poe help` is the only place
# it is written down. That is deliberate: a check that exists only as a
# workflow file is a check nobody runs before pushing, and this one is meant to
# be run by a person who has decided a change deserves it. The workflow's
# header holds the policy - as preparation for any release, when a new app or a
# significant database change arrives, and when a database driver or a maths
# library moves version significantly.
#
# `-p randomly` is passed here rather than enabled for every run. `poe test`
# has to stay deterministic: a failure you cannot reproduce from the command
# that produced it is worse than no failure at all. pytest-randomly prints the
# seed it chose at the top of its output, and replaying that seed replays the
# order exactly, which is what makes a failure here actionable.
#
# What it catches is tests that depend on each other - state left in a module,
# a class attribute mutated, an id that is 1 only because nothing ran first. It
# does not catch a test that depends on the order a *database* returns rows in;
# that is a property of the query, and the fix is an explicit `order_by`.
#
# Known: the suite does not pass shuffled yet. Measured 2026-10-19, seeds 1 and
# 2 each give 15 failures. So expect red, and read the failures rather than the
# count.

[[tasks.test-order.args]]
name = "seed"
positional = true
required = false
help = "A seed printed by an earlier run, to replay that exact order"


[tasks.test-order]
help = "Run the suite in a shuffled order, to catch tests that depend on each other"
interpreter = "python"
shell = """
import importlib.util
import os
import subprocess
import sys

# poe passes a declared arg to a `shell` task through the environment, and
# `${seed}` is not substituted inside a python body - see `test-engine`.
seed = os.environ.get('seed') or ''

if importlib.util.find_spec('pytest_randomly') is None:
    # The dev-group entry for pytest-randomly arrives with the
    # order-independence work, so `uv sync --group dev` only answers this once
    # that branch is in the tree. The one-off command works either way.
    print('pytest-randomly is not installed in this environment.')
    print()
    print('If the order-independence branch is in your tree:')
    print()
    print('    uv sync --group dev')
    print()
    print('Otherwise, for a one-off run without installing it:')
    print()
    print('    uv run --with pytest-randomly pytest -m \"not selenium\" -p randomly')
    sys.exit(1)

argv = [sys.executable, '-m', 'pytest', '-m', 'not selenium', '-p', 'randomly']
if seed:
    argv.append('--randomly-seed=%s' % seed)
    print('Replaying seed %s.' % seed)
else:
    print('New shuffle. pytest-randomly prints the seed it chose below; pass it')
    print('back as `poe test-order <seed>` to run the same order again.')
print()

sys.exit(subprocess.call(argv))
"""


[[tasks.test-engine.args]]
name = "engine"
positional = true
required = true
help = "sqlite, memory, postgres, mysql or mssql"


[tasks.test-engine]
help = "Run the suite against one engine, restoring your settings afterwards"
interpreter = "python"
shell = """
import os, pathlib, shutil, subprocess, sys

# poe passes declared task args to a `shell` task as environment
# variables. `${engine}` is NOT substituted inside a python-interpreter
# body - it arrives literally - so read it from the environment.
engine = os.environ['engine']
src = pathlib.Path(f'qatrack/local_test_settings.{engine}.py')
live = pathlib.Path('qatrack/local_test_settings.py')
backup = pathlib.Path('qatrack/local_test_settings.py.bak')

if not src.exists():
    print(f'error: {src} not found.')
    print(f'Create it first - see deploy/dev/local_test_settings.{engine}.py '
          'for a starting template.')
    sys.exit(1)

# try/finally rather than the shell version's fall-through restore. The
# Makefile/`_test-engine` form only restores if the pytest line completes;
# interrupt it (Ctrl-C) and your real local_test_settings.py is left
# swapped out. This restores on any exit, including KeyboardInterrupt.
had_existing = live.exists()
if had_existing:
    shutil.copyfile(live, backup)
shutil.copyfile(src, live)
try:
    status = subprocess.call([sys.executable, '-m', 'pytest'])
finally:
    if had_existing:
        shutil.move(str(backup), str(live))
    else:
        live.unlink(missing_ok=True)
sys.exit(status)
"""


[tasks.test-integration]
help = "Provision a fresh sqlite db like a real deployment, then run the suite against it"
interpreter = "python"
shell = """
import os, pathlib, shutil, subprocess, sys

DB = pathlib.Path('db/default.db')
DB_BAK = pathlib.Path('db/default.db.bak')
KEPT = pathlib.Path('db/pytest_default.db')
LIVE = pathlib.Path('qatrack/local_test_settings.py')
LIVE_BAK = pathlib.Path('qatrack/local_test_settings.py.bak')

pathlib.Path('db').mkdir(exist_ok=True)


def manage(*args, env=None):
    code = subprocess.call([sys.executable, 'manage.py', *args],
                           env={**os.environ, **(env or {})})
    if code != 0:
        raise SystemExit(code)


# Refuse, before touching anything, if this would provision the developer's own
# database. migrate/createcachetable/collectstatic/createsuperuser are manage.py
# commands, so they read local_settings.py - the development settings - while
# only pytest reads the local_test_settings.py this task writes its TEST name
# into. nsmela measured the consequence on 2026-10-08: with local_settings.py
# naming db/my_real_dev.db, a superuser/superuser account was created in that
# database and the tests ran against a separate db/default.db. Asking Django for
# the effective name is the only reliable check - the value can come from any
# layer of the settings.
effective = subprocess.run(
    [sys.executable, '-c',
     "import os, django; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'qatrack.settings');"
     "django.setup();"
     "from django.conf import settings; print(settings.DATABASES['default']['NAME'])"],
    capture_output=True, text=True,
)
if effective.returncode != 0:
    print(effective.stderr.strip() or 'could not read DATABASES from the settings')
    raise SystemExit(1)
# Compared as paths, not strings: the settings hold a posix-style name and
# str(DB) is backslashed on Windows.
if pathlib.Path(effective.stdout.strip()) != DB:
    print('error: this task provisions the database your settings point at, and that is')
    print('         %s' % effective.stdout.strip())
    print('not %s. Continuing would migrate that database and leave a' % DB)
    print('superuser/superuser account in it, while the tests ran somewhere else.')
    print('Point local_settings.py at %s before running this.' % DB)
    raise SystemExit(1)

# Refuse too if a backup from an interrupted run is still here, rather than
# moving a throwaway copy on top of it - which is how the real loss happens.
stale = [p for p in (DB_BAK, LIVE_BAK) if p.exists()]
if stale:
    print('error: a backup from an earlier run is still here:')
    for p in stale:
        print('  %s' % p)
    print('That run did not finish restoring. Put them back, or remove them, first.')
    raise SystemExit(1)

# Move the developer's real database and settings aside. The shell version
# of this task does the same, but restores by falling through to its last
# few lines - so if provisioning fails, or the run is interrupted, the
# developer is left with their dev database sitting at db/default.db.bak
# and no db/default.db at all. Everything below is wrapped so the restore
# happens on any exit.
had_db = DB.exists()
had_live = LIVE.exists()
if had_db:
    shutil.move(str(DB), str(DB_BAK))
if had_live:
    shutil.copyfile(LIVE, LIVE_BAK)
shutil.copyfile('deploy/dev/local_test_settings.sqlite.py', LIVE)
# test-integration only: test the database this task just provisioned, rather
# than the template's separate test database. The template deliberately names a
# different one, because Django deletes a file-based test database before
# creating it and again at teardown - when the two names matched, a plain
# pytest destroyed the developer's populated db/default.db. This task is the
# one thing that really does want them to be the same. Mirrors the Makefile.
with LIVE.open('a', encoding='utf-8') as fh:
    fh.write("\\nDATABASES['default']['TEST']['NAME'] = 'db/default.db'\\n")

status = 1
try:
    # Provision exactly the way a fresh deployment would, so the whole
    # sequence is exercised for real and not just a disposable test db.
    manage('migrate')
    manage('createcachetable')
    manage('collectstatic', '--noinput')
    manage('createsuperuser', '--noinput', env={
        'DJANGO_SUPERUSER_USERNAME': 'superuser',
        'DJANGO_SUPERUSER_PASSWORD': 'superuser',
        'DJANGO_SUPERUSER_EMAIL': 'superuser@example.com',
    })
    status = subprocess.call([sys.executable, '-m', 'pytest', '--reuse-db'])
finally:
    # Keep the provisioned db for inspection, but only if it exists - the
    # shell version runs its `mv` unconditionally and errors when
    # provisioning failed before the database was created.
    if DB.exists():
        KEPT.unlink(missing_ok=True)
        shutil.move(str(DB), str(KEPT))
        print(f'provisioned database kept at {KEPT}')
    if had_live:
        shutil.move(str(LIVE_BAK), str(LIVE))
    else:
        LIVE.unlink(missing_ok=True)
    if had_db:
        shutil.move(str(DB_BAK), str(DB))
        print(f'restored your {DB}')

sys.exit(status)
"""

# ==========================================================================
# Tests - browser / GUI
# ==========================================================================


# GUI/Selenium only. Both axes - browser and window - are named in full on
# every task, because neither has a "real" option and a deviation: Chromium
# finds timing races Firefox does not, and a visible window is how you debug
# them. Naming one combination shorter than the others would imply a pecking
# order that does not exist.
#
# `test-gui` is not a fifth combination - it deliberately sets nothing, so it
# runs whatever your own settings configure.
#
# Plain tasks rather than one with a --browser argument: poe stops forwarding
# dash-prefixed tokens as soon as a task declares a named arg (see the note on
# _test-engine in poe_tasks/make_compat.toml), and `-k`, `-x` and `--pdb` are
# exactly what you reach for on a failing browser test.
#
# The env tables are the reason these exist - `SELENIUM_BROWSER=chromium
# pytest ...` is not something you can type in cmd or PowerShell, and Windows
# is a large share of real deployments.
#
# Note these set environment variables, and qatrack/local_test_settings.py is
# imported after settings.py has read them. If you uncomment SELENIUM_BROWSER
# or SELENIUM_HEADLESS there, your file wins and these tasks stop having any
# effect - which looks exactly like the task being broken.

[tasks.test-gui]
help = "Run ONLY the GUI/Selenium tests, using whatever your settings configure"
cmd = "pytest -m selenium"


[tasks.test-gui-firefox-headless]
help = "Run ONLY the GUI/Selenium tests: firefox, no window (no display needed)"
cmd = "pytest -m selenium"
env = { SELENIUM_BROWSER = "firefox", SELENIUM_HEADLESS = "True" }


[tasks.test-gui-firefox-visible]
help = "Run ONLY the GUI/Selenium tests: firefox, visible window (needs a display)"
cmd = "pytest -m selenium"
env = { SELENIUM_BROWSER = "firefox", SELENIUM_HEADLESS = "False" }


[tasks.test-gui-chromium-headless]
help = "Run ONLY the GUI/Selenium tests: chromium, no window (no display needed)"
cmd = "pytest -m selenium"
env = { SELENIUM_BROWSER = "chromium", SELENIUM_HEADLESS = "True" }


[tasks.test-gui-chromium-visible]
help = "Run ONLY the GUI/Selenium tests: chromium, visible window (needs a display)"
cmd = "pytest -m selenium"
env = { SELENIUM_BROWSER = "chromium", SELENIUM_HEADLESS = "False" }


# The two tasks below are the supported way to watch a GUI run. They are the
# only advertised interface to the pause: `SELENIUM_SLOW_MO` is read straight
# from the environment in live.py rather than exposed as a setting beside
# SELENIUM_BROWSER and SELENIUM_HEADLESS, so that it cannot be left switched on
# in a settings file. One consequence worth knowing, and the opposite of the
# warning above: because it does not come from settings, a local settings file
# cannot override it either.
#
# Watching costs time. Every click, keystroke and page load pauses, so a suite
# that runs in about eight minutes takes appreciably longer. Run a single test
# or a class while you are actually watching something:
#
#     poe test-gui-firefox-watch -k test_schedule_report
#
# **A watched run is for looking at, not for measuring.** Pauses can let a race
# that fails at full speed pass here, so its pass count is not evidence about
# the suite. The harness prints that warning itself at the start of the run.

[tasks.test-gui-firefox-watch]
help = "Watch a GUI run: firefox, visible, paused between actions (not for measuring)"
cmd = "pytest -m selenium"
env = { SELENIUM_BROWSER = "firefox", SELENIUM_HEADLESS = "False", SELENIUM_SLOW_MO = "0.4" }


[tasks.test-gui-chromium-watch]
help = "Watch a GUI run: chromium, visible, paused between actions (not for measuring)"
cmd = "pytest -m selenium"
env = { SELENIUM_BROWSER = "chromium", SELENIUM_HEADLESS = "False", SELENIUM_SLOW_MO = "0.4" }
