# What nginx serves for QATrack+, over HTTP or HTTPS.

# The container health check.
location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "OK\n";
}

location /static/ {
    alias /usr/src/qatrackplus/qatrack/static/;
    access_log off;
    expires 1d;
}

location /media/ {
    alias /usr/src/qatrackplus/qatrack/media/;
}

# The file that marks a media folder on the server as QATrack+'s (see
# deploy/docker/django/init.sh) is not an uploaded file.
location = /media/.qatrackplus-data {
    return 404;
}

# Nor is anything in restore-media's working folders (.restore.* at the top of
# the media folder, see deploy/docker/backup/restore-media.sh): while a restore
# runs, one holds a whole unpacked backup of the uploaded files. ^~ keeps any
# other location from taking these requests first.
location ^~ /media/.restore. {
    return 404;
}

location / {
    # Look django up through Docker's DNS as requests arrive (cached for 10s), not
    # once at startup. Recreating django, as an upgrade does, can give it a new
    # address; nginx would otherwise keep using the old one and answer 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $qatrack_upstream http://django:8000;
    proxy_pass $qatrack_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # With HTTP_OR_HTTPS=https, QATrack+ reads the scheme from this header.
    proxy_set_header X-Forwarded-Proto $scheme;
}
