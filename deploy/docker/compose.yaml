name: qatrackplus

# Every service keeps at most 50 MB of output (5 files of 10 MB), so what
# `docker compose logs` keeps cannot fill the disk. QATrack+'s own log files
# are in logs-volume (or QATRACK_LOGS_DIR); they rotate at 10 MB (see LOGGING
# in settings.py).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    build:
      context: ./nginx
    restart: always
    logging: *logging
    # Only the settings nginx needs from .env (see .env.example), not the
    # database password.
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      HTTP_OR_HTTPS: ${HTTP_OR_HTTPS:-http}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-100m}
      NGINX_SSL_CERTIFICATE: ${NGINX_SSL_CERTIFICATE:-cert.pem}
      NGINX_SSL_CERTIFICATE_KEY: ${NGINX_SSL_CERTIFICATE_KEY:-key.pem}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - ${QATRACK_MEDIA_DIR:-media-volume}:/usr/src/qatrackplus/qatrack/media:ro
      - static-volume:/usr/src/qatrackplus/qatrack/static:ro
      - ./user-data/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Runs once before django: the app runs as uid 1000, and installs from before
  # 4.0.2 ran it as root, so their volumes can hold root-owned files. This
  # re-owns only those files, then exits. QATRACK_UID/QATRACK_GID are only for
  # compose.dev.yaml, which runs the app as the developer's own user.
  #
  # The same goes for a folder on the server set by QATRACK_MEDIA_DIR,
  # QATRACK_USER_DATA_DIR or QATRACK_LOGS_DIR in .env. Since that cannot be
  # undone, init first refuses to start, changing nothing, if a folder is not
  # empty and not marked as QATrack+'s, or if one location is inside another
  # (the backups folder included). See deploy/docker/django/init.sh.
  init:
    # The image the django service builds; never pulled from a registry.
    image: ${COMPOSE_PROJECT_NAME:-qatrackplus}-django
    pull_policy: never
    user: "0"
    restart: "no"
    logging: *logging
    command: [ "/init.sh" ]
    # Only what init needs: which locations are folders on the server.
    environment:
      QATRACK_UID: ${QATRACK_UID:-1000}
      QATRACK_GID: ${QATRACK_GID:-1000}
      QATRACK_MEDIA_DIR: ${QATRACK_MEDIA_DIR:-}
      QATRACK_USER_DATA_DIR: ${QATRACK_USER_DATA_DIR:-}
      QATRACK_LOGS_DIR: ${QATRACK_LOGS_DIR:-}
      QATRACK_BACKUPS_DIR: ${QATRACK_BACKUPS_DIR:-}
    volumes:
      - ${QATRACK_MEDIA_DIR:-media-volume}:/usr/src/qatrackplus/qatrack/media
      - static-volume:/usr/src/qatrackplus/qatrack/static
      - ${QATRACK_USER_DATA_DIR:-user-data-volume}:/usr/src/qatrackplus/deploy/docker/user-data
      - ${QATRACK_LOGS_DIR:-logs-volume}:/usr/src/qatrackplus/logs
      # Read-only, and never re-owned: only so init can check that no other
      # location is inside the backups folder, or contains it.
      - ${QATRACK_BACKUPS_DIR:-./backups}:/backups:ro

  django:
    build:
      context: ../../
      dockerfile: deploy/docker/django/Dockerfile
      # A site's own Python packages (see site-requirements/README.md), passed
      # as a separate context so nothing in that folder is copied into the
      # image. The folder must exist (its README keeps it in every checkout);
      # without it the build stops with "failed to get build context
      # site-requirements". Needs Docker Compose 2.17+ (older releases stop up,
      # build and run with "Additional property additional_contexts is not
      # allowed") and Docker Engine 23.0+ for named build contexts; see
      # "Minimum Docker versions" in docs/install/docker.rst.
      additional_contexts:
        site-requirements: ./site-requirements
    # init and django-q run this same image, so it is built once. It is named
    # after the Compose project, so a second stack on the same host (a test
    # copy run with -p) builds its own image instead of replacing this one.
    image: ${COMPOSE_PROJECT_NAME:-qatrackplus}-django
    pull_policy: never
    restart: always
    logging: *logging
    env_file: .env
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ${QATRACK_MEDIA_DIR:-media-volume}:/usr/src/qatrackplus/qatrack/media
      - static-volume:/usr/src/qatrackplus/qatrack/static
      # Keeps the generated secret key (when SECRET_KEY is not set in .env)
      # across rebuilds, so upgrades do not log every user out.
      - ${QATRACK_USER_DATA_DIR:-user-data-volume}:/usr/src/qatrackplus/deploy/docker/user-data
      # QATrack+'s log files (debug.log, auth.log, ...), kept across rebuilds and
      # shared with django-q, as on a Linux install.
      - ${QATRACK_LOGS_DIR:-logs-volume}:/usr/src/qatrackplus/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      # Before gunicorn starts, the entrypoint creates the cache table, runs
      # every migration and collects static files. On a first install or an
      # upgrade that can take several minutes. Failed checks during
      # start_period don't count, so this only stops `docker compose up`
      # giving up on django (and never starting nginx and django-q) too early;
      # a normal start is still marked healthy at the first passing check.
      start_period: 600s

  # Runs QATrack+'s background tasks: scheduled notifications, scheduled
  # reports, and the emails and PDFs they send.
  django-q:
    image: ${COMPOSE_PROJECT_NAME:-qatrackplus}-django
    pull_policy: never
    command: [ "python", "manage.py", "qcluster" ]
    init: true
    restart: always
    logging: *logging
    env_file: .env
    depends_on:
      # django applies the database migrations before it reports healthy.
      django:
        condition: service_healthy
    volumes:
      - ${QATRACK_MEDIA_DIR:-media-volume}:/usr/src/qatrackplus/qatrack/media
      # PDF reports link their stylesheets and logo from the collected static
      # files, which django fills in before it reports healthy.
      - static-volume:/usr/src/qatrackplus/qatrack/static:ro
      - ${QATRACK_USER_DATA_DIR:-user-data-volume}:/usr/src/qatrackplus/deploy/docker/user-data:ro
      - ${QATRACK_LOGS_DIR:-logs-volume}:/usr/src/qatrackplus/logs
    healthcheck:
      # The cluster is running. [e] keeps this check from matching itself.
      test: [ "CMD-SHELL", "grep -qa 'qclust[e]r' /proc/[0-9]*/cmdline" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    restart: always
    logging: *logging
    env_file: .env
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-qatrackplus}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    build:
      context: ./backup
    # restore-media runs this same image, so it is built once (see django).
    image: ${COMPOSE_PROJECT_NAME:-qatrackplus}-backup
    pull_policy: never
    init: true
    restart: always
    logging: *logging
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${QATRACK_BACKUPS_DIR:-./backups}:/backups
      # Read-only: the nightly backup only reads the uploaded files, so it can
      # never change them. Only restore-media, below, can write to them.
      - ${QATRACK_MEDIA_DIR:-media-volume}:/media:ro
    healthcheck:
      # crond, which runs the nightly backup, is running.
      test: [ "CMD", "pgrep", "crond" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Puts a backup of the uploaded files back. It only runs when asked:
  #   docker compose run --rm restore-media media_YYYYMMDD_HHMMSS.tar.gz
  # The "restore" profile keeps `docker compose up` from ever starting it.
  restore-media:
    profiles: [ "restore" ]
    image: ${COMPOSE_PROJECT_NAME:-qatrackplus}-backup
    pull_policy: never
    entrypoint: [ "restore-media" ]
    init: true
    restart: "no"
    logging: *logging
    volumes:
      # Writable: the lock file, shared with the backup service, is kept here.
      - ${QATRACK_BACKUPS_DIR:-./backups}:/backups
      # The restore unpacks into a folder inside this mount, then swaps the files
      # in by renaming them, so they never cross from one disk to another.
      - ${QATRACK_MEDIA_DIR:-media-volume}:/media

# Where QATrack+ keeps its data. Each ${QATRACK_..._DIR:-...} mount above uses
# the named volume (or, for backups, the folder) after the :-, unless .env sets
# that variable to a folder on the server (see .env.example, and "Keeping
# QATrack+'s data in folders on the server" in docs/install/docker.rst). Every
# service that mounts a location uses the same variable, so they always share
# it. A volume no service uses is left out, and never created.
#
# postgres-volume has no such setting: the database's own files are only safe to
# copy while PostgreSQL is stopped, and the nightly backup already writes a
# database dump to the backups folder. static-volume has none either: QATrack+
# fills it afresh every time it starts, so it holds nothing to keep.
volumes:
  postgres-volume:
  media-volume:
  static-volume:
  user-data-volume:
  logs-volume:
