name: qatrackplus

services:
  nginx:
    build:
      context: ./nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - ${MEDIA_DIR:-media-volume}:/app/qatrack/media:ro
      - static-volume:/app/qatrack/static:ro
      - ${SSL_DIR:-./user-data/ssl}:/etc/nginx/ssl:ro  # To customize SSL location, set SSL_DIR, else the default ./user-data/ssl will be used.

  django:
    image: qatrackplus-django
    build:
      context: ../../
      dockerfile: deploy/docker/django/Dockerfile
      args:
        BUILDER_BASE_IMAGE: ${BUILDER_BASE_IMAGE:-ghcr.io/astral-sh/uv:0.12-python3.12-trixie-slim}
        RUNTIME_BASE_IMAGE: ${RUNTIME_BASE_IMAGE:-python:3.12-slim-trixie}
    restart: always
    env_file: .env
    environment:
      USE_DOCKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${MEDIA_DIR:-media-volume}:/app/qatrack/media
      - static-volume:/app/qatrack/static
      - ${USER_DATA_DIR:-user-data-volume}:/app/deploy/docker/user-data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  django-q:
    image: qatrackplus-django
    init: true
    restart: always
    env_file: .env
    environment:
      USE_DOCKER: "true"
    command:
      - python
      - manage.py
      - qcluster
    depends_on:
      django:
        condition: service_healthy
    volumes:
    - ${MEDIA_DIR:-media-volume}:/app/qatrack/media

  postgres:
    image: postgres:15-alpine
    restart: always
    env_file: .env
    volumes:
      - ${POSTGRES_DATA_DIR:-postgres-volume}:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-qatrackplus}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    build:
      context: ./backup
    init: true
    stop_grace_period: 60s
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${BACKUPS_DIR:-backups-volume}:/backups
      - ${MEDIA_DIR:-media-volume}:/media:ro

volumes:
  postgres-volume: # Persists database in a docker volume. To use a bind mount instead, set POSTGRES_DATA_DIR.
  backups-volume: # Persists backups in a docker volume. To use a bind mount instead, set BACKUPS_DIR.
  media-volume: # Persists media files in a docker volume. To use a bind mount instead, set MEDIA_DIR.
  static-volume: # Shared docker volume for static assets used by django and nginx services.
  user-data-volume: # Persists secret_key.txt in a docker volume (if SECRET_KEY was not set in env). To use a bind mount instead, set USER_DATA_DIR.
