name: qatrackplus

services:
  nginx:
    build:
      context: ./nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - media-volume:/usr/src/qatrackplus/qatrack/media:ro
      - static-volume:/usr/src/qatrackplus/qatrack/static:ro
      - ./user-data/ssl:/etc/nginx/ssl:ro

  # Runs once before django: the app runs as uid 1000, and installs from before
  # 4.0.2 ran it as root, so their volumes can hold root-owned files. This
  # re-owns only those files, then exits.
  init:
    build:
      context: ../../
      dockerfile: deploy/docker/django/Dockerfile
    user: "0"
    restart: "no"
    command:
      - sh
      - -c
      - find /usr/src/qatrackplus/qatrack/media /usr/src/qatrackplus/qatrack/static \( ! -user 1000 -o ! -group 1000 \) -exec chown 1000:1000 {} +
    volumes:
      - media-volume:/usr/src/qatrackplus/qatrack/media
      - static-volume:/usr/src/qatrackplus/qatrack/static

  django:
    build:
      context: ../../
      dockerfile: deploy/docker/django/Dockerfile
    restart: always
    env_file: .env
    depends_on:
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - media-volume:/usr/src/qatrackplus/qatrack/media
      - static-volume:/usr/src/qatrackplus/qatrack/static
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    restart: always
    env_file: .env
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-qatrackplus}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    build:
      context: ./backup
    init: true
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - media-volume:/media:ro

volumes:
  postgres-volume:
  media-volume:
  static-volume:
