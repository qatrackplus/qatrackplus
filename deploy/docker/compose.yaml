name: qatrackplus

services:
  nginx:
    image: qatrackplus-nginx:prod
    build:
      context: ./nginx
    hostname: qat-nginx
    restart: always
    env_file: .env
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - ${MEDIA_DIR:-media-volume}:/app_data/media:ro,z
      - static-volume:/app_data/static:ro,z
      - ${SSL_DIR:-./ssl}:/etc/nginx/ssl:ro  # To customize SSL certificate/certificate key location, set SSL_DIR, else the default ./ssl will be used.
    healthcheck:
      test:
        - CMD-SHELL
        - >
          nginx -t &&
          curl -fsS -H 'Host: nginxhc' http://localhost/healthcheck >/dev/null
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  django:
    image: qatrackplus-django:prod
    hostname: qat-django
    shm_size: 256m  # increased from the default 64m for chromium HTML-to-PDF conversion
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"
    build:
      context: ../../
      dockerfile: deploy/docker/django/Dockerfile
      args:
        BUILDER_BASE_IMAGE: ${BUILDER_BASE_IMAGE:-ghcr.io/astral-sh/uv:0.12-python3.12-trixie-slim}
        RUNTIME_BASE_IMAGE: ${RUNTIME_BASE_IMAGE:-python:3.12-slim-trixie}
    restart: always
    env_file: .env
    environment:
      USE_DOCKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${MEDIA_DIR:-media-volume}:/app_data/media:z
      - static-volume:/app_data/static:z
      - ${USER_DATA_DIR:-user-data-volume}:/user_data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 15s
      timeout: 10s
      retries: 3
      # The first start is much slower than later ones: the entrypoint runs
      # createcachetable, migrate and collectstatic (846 files) before gunicorn
      # binds. 30s plus 3 x 15s gave a 75 second budget, and a first boot on a
      # 2-CPU Linode took 71 seconds to reach "Listening at" - so the container
      # was marked unhealthy, nginx never started because it waits for django to
      # be healthy, and `docker compose up -d` exited 1 on a deployment that was
      # in fact seconds from working. Measured 2026-10-18 following
      # docs/install/docker_production.rst as written.
      #
      # A failure inside start_period does not count against `retries`, so a
      # generous value costs a fast machine nothing: it still reports healthy on
      # its first successful probe.
      start_period: 300s

  django-q:
    image: qatrackplus-django:prod
    hostname: qat-django-q
    shm_size: 256m  # increased from the default 64m for chromium HTML-to-PDF conversion
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"
    init: true
    restart: always
    env_file: .env
    environment:
      USE_DOCKER: "true"
    command:
      - python
      - manage.py
      - qcluster
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - ${MEDIA_DIR:-media-volume}:/app_data/media:z
      - static-volume:/app_data/static:ro,z
      - ${USER_DATA_DIR:-user-data-volume}:/user_data:ro
    healthcheck:
      # Check that the qcluster process exists and that DB access is working
      test:
        - CMD-SHELL
        - >
          pgrep -f "manage.py qcluster" >/dev/null &&
          python manage.py shell -c
          "from django_q.models import Schedule;
          Schedule.objects.exists()"
          >/dev/null 2>&1
      interval: 15s
      timeout: 15s
      retries: 3
      # Same exposure as django's, and a heavier probe: each attempt starts a
      # full `manage.py shell`. django-q also waits for django to be healthy,
      # so on a slow first boot it begins its own 75 second budget late.
      start_period: 300s

  postgres:
    image: postgres:15-alpine
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"
    restart: always
    env_file: .env
    ports:
      - "${POSTGRES_HOST_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-postgres-volume}:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-change_me} -d $${POSTGRES_DB:-qatrackplus}" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backup:
    build:
      context: ./backup
    hostname: qat-backup
    init: true
    stop_grace_period: 60s
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${BACKUPS_DIR:-backups-volume}:/backups
      - ${MEDIA_DIR:-media-volume}:/app_data/media:z
    healthcheck:
      # Test that cron is still running and that the backup dir/volume is writable
      test:
        - CMD-SHELL
        - >
          pgrep crond >/dev/null &&
          test -w /backups
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 5s

volumes:
  postgres-volume: # Persists database in a docker volume. To use a bind mount instead, set POSTGRES_DATA_DIR.
  backups-volume: # Persists backups in a docker volume. To use a bind mount instead, set BACKUPS_DIR.
  media-volume: # Persists media files in a docker volume. To use a bind mount instead, set MEDIA_DIR.
  static-volume: # Shared docker volume for static assets used by django and nginx services.
  user-data-volume: # Persists secret_key.txt in a docker volume (if SECRET_KEY was not set in env). To use a bind mount instead, set USER_DATA_DIR.
