[tool.poe.tasks.delete-qc-records]
help = "DESTRUCTIVE: delete test list instances, unit test collections and content types"
# Same treatment as clearct/flushdb: a `cmd` task, so no shell is needed and
# the quoted -c payload survives poe's argument splitting intact.
#
# RENAMED from the Makefile's `__cleardb__`, and this is the one place the
# task names deliberately do not mirror. poe refuses to run any task whose
# name starts with an underscore ("Tasks prefixed with `_` cannot be
# executed directly") and omits it from `poe --help` entirely, so the
# mirrored `__cleardb__` entry was unreachable dead config from the day it
# was written - `poe __cleardb__` has never worked. `make __cleardb__` is
# unaffected and still works.
cmd = 'python manage.py shell -c "from qatrack.qa.models import *; TestListInstance.objects.all().delete(); UnitTestCollection.objects.all().delete(); ContentType.objects.all().delete()"'


[tool.poe.tasks.delete-users-and-types]
help = "DESTRUCTIVE: delete all users, tolerances and content types"
# A `cmd` task, so poe runs it directly with no shell involved at all -
# nothing here needs one, and avoiding it sidesteps the whole question of
# which shell exists on the host. Verified that the quoted -c payload
# survives poe's argument splitting intact.
cmd = 'python manage.py shell -c "from qatrack.qa.models import *; [m.objects.all().delete() for m in [ContentType, Tolerance, User]]"'


[tool.poe.tasks.delete-all-data]
help = "DESTRUCTIVE: empty every table (manage.py flush) - schema and migrations stay"
# This is the one place the poe tasks deliberately DIVERGE from the
# Makefile, rather than mirroring it. `make flushdb` runs
#
#     python manage.py sqlflush | python manage.py dbshell
#
# which is broken in practice: `dbshell` execs the database's own client
# binary, so on sqlite it needs the `sqlite3` CLI on PATH. Without it the
# pipeline dies, and - because the failure happens in the *consumer* - what
# the developer sees is a BrokenPipeError traceback out of the producer,
# not Django's actual "You appear not to have the 'sqlite3' program
# installed" message. Confirmed on this machine, where sqlite3 is absent.
#
# `manage.py flush` is Django's own built-in for this and needs no external
# binary, so it works on every backend and every platform, with no pipe and
# therefore no shell. Behaviour differs slightly and for the better: flush
# also resets sequences and re-runs post-migrate handlers.
cmd = "python manage.py flush --noinput"

# ==========================================================================
# Deployment helpers
# ==========================================================================


# These four are for a *deployment*, not a development checkout. The templates
# under deploy/ hardcode /home/YOURUSERNAMEHERE/web/qatrackplus and substitute
# only the username, so running them anywhere else installs config that points
# at a directory which does not exist - valid nginx syntax serving nothing, and
# supervisor programs whose interpreter is not there.
#
# Verified here as far as is possible without root: the templates carry the
# placeholder (2, 3 and 4 occurrences), the substitution leaves none behind,
# and the paths resolve to what the install docs prescribe. The sudo steps
# themselves are unverified, which is what the WIP- marks.
[tool.poe.tasks."nginx-conf"]
help = "WIP- Ubuntu only: install the nginx site config (runs sudo); unverified here"
shell = '''
sudo sed "s/YOURUSERNAMEHERE/$USER/g" deploy/nginx/qatrack.conf > qatrack.conf
sudo mv qatrack.conf /etc/nginx/sites-available/qatrack.conf
sudo ln -sf /etc/nginx/sites-available/qatrack.conf /etc/nginx/sites-enabled/qatrack.conf
sudo usermod -a -G $USER www-data
sudo service nginx restart
'''


[tool.poe.tasks."supervisor-conf"]
help = "WIP- Ubuntu only: install supervisor configs for django-q2/gunicorn (runs sudo); unverified here"
shell = '''
sudo sed "s/YOURUSERNAMEHERE/$USER/g" deploy/supervisor/django-q2.conf > django-q2.conf
sudo sed "s/YOURUSERNAMEHERE/$USER/g" deploy/supervisor/gunicorn.conf > gunicorn.conf
sudo mv django-q2.conf /etc/supervisor/conf.d/
sudo mv gunicorn.conf /etc/supervisor/conf.d/
sudo supervisorctl reread
sudo supervisorctl update
'''

[tool.poe.tasks."nginx-conf-remove"]
help = "WIP- Undo nginx-conf: remove the site config and restart nginx; unverified here"
# Deliberately does not undo `usermod -a -G $USER www-data`. Taking a group
# membership away again can break anything else that came to rely on it, and
# an uninstall that quietly changes account permissions is worse than one that
# leaves a harmless group in place. Remove it by hand if you want it gone:
#   sudo gpasswd -d www-data $USER
shell = """
sudo rm -f /etc/nginx/sites-enabled/qatrack.conf
sudo rm -f /etc/nginx/sites-available/qatrack.conf
sudo service nginx restart
"""

[tool.poe.tasks."supervisor-conf-remove"]
help = "WIP- Undo supervisor-conf: stop the processes, remove the configs, reload; unverified here"
shell = """
sudo supervisorctl stop django-q2 gunicorn
sudo rm -f /etc/supervisor/conf.d/django-q2.conf
sudo rm -f /etc/supervisor/conf.d/gunicorn.conf
sudo supervisorctl reread
sudo supervisorctl update
"""

