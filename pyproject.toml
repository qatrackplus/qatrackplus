[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qatrack"]
include = [
    "qatrack/**/*",
    "manage.py",
    "README.md",
    "LICENSE",
]

[project]
name = "qatrackplus"
version = "4.0.0"
description = "QATrack+ is an open source application for managing QC data in radiotherapy and diagnostic imaging clinics"
readme = "README.md"
requires-python = ">=3.12, <=3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "QATrack+ contributors", email = "randy@multileaf.ca"},
]
keywords = ["QATrack+", "medical physics", "TG142", "quality assurance", "linac", "CT", "MRI", "radiotherapy", "diagnostic imaging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry", 
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Programming Language :: JavaScript",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Version Control :: Git",
]
package-mode = false

dependencies = [
    "Django==4.2",
    "django-q2>=1.8.0",
    "beautifulsoup4==4.9.3",
    "concurrent-log-handler==0.9.19",
    "django-auth-adfs>=1.7.0",
    "django-braces>=1.17,<1.18",
    "django-contrib-comments>=2.2,<3.0",
    "django-crispy-forms>=1.14.0,<2.0",
    "django-dynamic-raw-id>=4.0",
    "django-extensions>=3.1.0,<4.0",
    "django-filter>=23.0",
    "django-formtools>=2.5.1,<3.0",
    "django-listable>=0.9.0,<1.0",
    "django-mptt>=0.13.4,<1.0",
    "django-mptt-admin>=2.0",
    "django-picklefield>=3.1",
    "django-registration>=3.2",
    "djangorestframework>=3.14.0",
    "gunicorn>=22.0.0",
    "djangorestframework-filters>=1.0.0.dev2",
    "django-widget-tweaks>=1.5.0",
    "inflection>=0.5.0,<1.0",
    "uritemplate>=4.0.0,<5.0",
    "html5lib>=1.1,<2.0",
    "markdown>=3.4.0,<4.0",
    "matplotlib>=3.7.0,<4.0",
    "numpy>=1.21.0,<2.0",
    "openpyxl>=3.0.6,<4.0",
    "pandas>=1.3.0,<3.0",
    "Pillow>=9.0.0,<11.0",
    "pydicom>=2.1.2,<4.0",
    "pylinac>=3.20,<4.0",
    "pynliner>=0.8.0,<1.0",
    "python-dateutil>=2.8.1,<3.0",
    "reportlab>=4.0.0,<5.0",
    "requests>=2.25.0,<3.0",
    "scipy>=1.7.0,<2.0",
    "urllib3>=1.25.11,<3.0",
    "weasyprint>=65.0,<66.0",
    "xlrd>=2.0.1,<3.0",
    "XlsxWriter>=1.3.7,<4.0",
    "django-recurrence>=1.11.0",
    "django-sql-explorer>=5.3",
    "black>=23.1.0",
    "blessed>=1.20.0",  # Required for django-q2 qmonitor
    "wcwidth<0.2.13",  # Pinned due to django-q2 qmonitor bug passing int instead of str
]

[project.optional-dependencies]
mysql = [
    "mysqlclient==2.0.3",
]

mssql = [
    "mssql-django>=1.5",
    "python-ldap",
    "django-auth-ldap<4.9",
]

postgres = [
    "psycopg[binary]",
]
win = [
    "CherryPy>=18.8.0; sys_platform == 'win32'",
    "pyreadline; sys_platform == 'win32'",
    "pywin32>=300; sys_platform == 'win32'",
]

docker = [
    "gunicorn>=21.2.0",
]

translations = [
    "polib>=1.2.0",
    "googletrans==4.0.0rc1",
]

[project.urls]
Homepage = "https://qatrackplus.com"
Documentation = "https://docs.qatrackplus.com"
Repository = "https://github.com/qatrackplus/qatrackplus"

[tool.pytest.ini_options]
testpaths = ["qatrack"]
norecursedirs = [
    "*.egg",
    ".eggs",
    "dist",
    "build",
    "docs",
    ".tox",
    ".git",
    "__pycache__",
    ".venv",
    "venv"
]
# "tests.py" is here because leaving it out has silently hidden real tests
# twice: qatrack/units/tests.py and qatrack/faults/tests/tests.py, 76 tests in
# the latter, neither of which errored or skipped - they simply never ran.
# test_collection.py below enforces that nothing else slips through the same
# way.
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-ra -q"
django_find_project = true
DJANGO_SETTINGS_MODULE = "qatrack.settings"
markers = [
    "selenium: mark a test as a selenium test",
]

[tool.uv.sources]
python-ldap = { url = "https://github.com/cgohlke/python-ldap-build/releases/download/v3.4.5/python_ldap-3.4.5-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and python_version== '3.12'" }

[dependency-groups]
dev = [
    # Testing framework and utilities
    "pytest>=7.0,<8.0",
    "pytest-django>=4.5.0,<5.0",
    "pytest-cov>=4.0,<5.0",
    "pytest-sugar>=0.9.6,<1.0",
    "coverage>=6.0,<8.0",
    "django-coverage>=1.2.4,<2.0",
    "freezegun>=1.0.0,<3.0",
    # >=4.10 for Selenium Manager (auto driver resolution) and the
    # Service/Options-based webdriver constructors the Selenium tests rely
    # on - no PyVirtualDisplay/Xvfb dependency needed, headless mode uses
    # each browser's own native support instead.
    "selenium>=4.10,<5.0",
    "django-debug-toolbar>=4.0,<5.0",
    "django-upgrade>=1.25.0",
    "pre-commit>=4.2.0",
    "fabric>=2.6.0",
    "ipdb",
    "ipython",
    "ruff",
    # Documentation
    "Jinja2==3.1.2",
    "Sphinx==7.4.7",
    "sphinx-autobuild>=1.0.0",
    "sphinx-rtd-theme==3.0.2",
    "sphinxcontrib-applehelp==1.0.4",
    "sphinxcontrib-devhelp==1.0.2",
    "sphinxcontrib-htmlhelp==2.0.1",
    "sphinxcontrib-jquery==4.1",
    "sphinxcontrib-jsmath==1.0.1",
    "sphinxcontrib-qthelp==1.0.3",
    "sphinxcontrib-websupport==1.2.4",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.0",
    "pytest-xdist>=3.0,<4.0",
    "pygraphviz>=2.0.2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

exclude = [
    ".git",
    "fixtures",
    "migration_data",
    "migrations",
    "south_migrations",
    "node_modules",
    "media",
    "static",
    "*tmp*"
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DJ"]
ignore = [
    "E501",  # line-too-long
    "E741",  # ambiguous-variable-name
    "DJ001", # Avoid using `null=True` on string-based fields such as `CharField`
    "DJ006", # Use `queryset.filter(...)` instead of `queryset.exclude(...)`
    "DJ007", # Save method should come before custom method
    "DJ008", # Model name should be singular
    "UP031", # Use format specifiers instead of percent format
]

[tool.ruff.format]
quote-style = "single"

# poethepoet task definitions - see https://poethepoet.natn.io/
#
# This mirrors the Makefile's dev/test commands and is meant to run
# *alongside* it, not replace it, while the project figures out whether to
# move off Make (every Makefile target here is .PHONY - there's no real
# file-dependency graph, so Make's core feature isn't actually in use, and
# it has no native Windows story despite this project supporting Windows
# deployments). `poe` itself isn't a project dependency - install it once,
# globally, via `uv tool install poethepoet`, then run any task below with
# `poe <task>` from inside the repo. `poe` auto-detects this project's
# `.venv` the same way `uv run` does, so tasks below call `pytest`/`python`
# directly rather than re-prefixing with `uv run`.
#
# ---------------------------------------------------------------------------
# If Make is retired and poe becomes the only task runner, these need doing
# first. None of them matter while the Makefile is still the primary runner
# and poe only mirrors it.
#
# 1. Windows. This is the sharp one, because Windows support is the main
#    argument for replacing Make - and these tasks do not currently deliver
#    it. Seven of them (dev-quickstart, _test-engine, test-integration,
#    dumpdata, docs, nginx-conf, supervisor-conf) use POSIX-only shell:
#    `cp -n`, `mkdir -p`, `[ -f ... ]`, `mv -f`, `rm -f`, `$?`, `$(date ...)`,
#    `sudo`. poe defaults `shell` tasks to bash/posix and, on Windows with no
#    other interpreter configured, fails with "Installing Git Bash or using
#    WSL should fix this" - which is the same "no native Windows story" the
#    Makefile is criticised for above. Fix before relying on it: set
#    `interpreter = "python"` on those tasks and port the logic to stdlib
#    (shutil.copy/os.makedirs/pathlib), which is genuinely cross-platform;
#    `interpreter = ["pwsh", "bash"]` is also supported if a PowerShell
#    rewrite is preferred. nginx-conf/supervisor-conf are Ubuntu-and-sudo
#    only by nature and should just be marked as such rather than ported.
#
# 2. Extra pytest args. `make test args="-k foo"` has no equivalent here for
#    any task declaring a named arg - poe silently drops `--`-separated
#    dash-prefixed tokens (see the note on _test-engine below). Retiring Make
#    would make that a real regression rather than a documented gap. The way
#    out is to drop the named `--engine` arg and define the five engine tasks
#    independently, so nothing on the path declares a named arg.
#
# 3. VERSION is currently written in three places: `VERSION` in the Makefile,
#    `version` under [project] above, and VERSION in [tool.poe.env] below.
#    The release checklist already flags the first two drifting apart. If
#    Make goes, do not keep a third copy - read it at task time from the
#    installed package metadata
#    (`python -c "import importlib.metadata as m; print(m.version(\'qatrackplus\'))"`)
#    or from [project] directly, and drop [tool.poe.env] VERSION.
#
# 4. Make poe a real dependency. It is deliberately not one today (install
#    once with `uv tool install poethepoet`), which is fine for an optional
#    mirror of the Makefile. As the only runner it becomes required to build
#    and test the project, so it belongs in the dev dependency group, where
#    `uv sync --dev` provides it and uv.lock pins it - matching how every
#    other tool in CI is now pinned.
#
# 5. Consider `[tool.poe.executor] locked = true`. poe runs tasks through
#    `uv run` already, and its uv executor accepts locked/frozen/no-sync/
#    exact. It is deliberately left unset here so poe behaves exactly like
#    the Makefile; that reason disappears with the Makefile. If CI ever
#    invokes poe directly, `locked = true` gives it the same lockfile
#    guarantee the workflow's `uv sync --locked` steps have.
#
# 6. `test_simple` exists only for Make muscle memory and is identical to
#    `test`. Drop it.
# ---------------------------------------------------------------------------
[tool.poe.env]
VERSION = "4.0.0"

# ==========================================================================
# Development environment
# ==========================================================================


# dev-init refuses to touch an environment that already exists, rather than
# copying what it can and failing partway through on `That username is already
# taken`. Half a setup and a confusing error is the worst of the options. If
# you want the old one gone, say so explicitly with dev-reset.
[tool.poe.tasks.dev-init]
help = "Create a fresh sqlite dev environment - refuses if one already exists"
interpreter = "python"
shell = """
import os, pathlib, shutil, subprocess, sys

TEMPLATES = [
    ('deploy/dev/local_settings.dev.py', 'qatrack/local_settings.py'),
    ('deploy/dev/local_test_settings.sqlite.py', 'qatrack/local_test_settings.py'),
    ('deploy/dev/local_test_settings.memory.py', 'qatrack/local_test_settings.memory.py'),
]
DB = pathlib.Path('db/default.db')

# Check everything before doing anything.
existing = [dst for _, dst in TEMPLATES if pathlib.Path(dst).exists()]
if DB.exists():
    existing.append(str(DB))

if existing:
    print('This already looks like a set up dev environment:')
    for path in existing:
        print(f'  {path}')
    print()
    print('dev-init will not write over any of it. Either remove what you do not')
    print('want and run this again, or use `poe dev-reset` to discard all of it')
    print('and start over.')
    sys.exit(1)

for src, dst in TEMPLATES:
    shutil.copyfile(src, dst)
    print(f'created {dst} from {src}')

pathlib.Path('db').mkdir(exist_ok=True)

def run(*args, env=None):
    result = subprocess.call([sys.executable, 'manage.py', *args],
                             env={**os.environ, **(env or {})})
    if result != 0:
        sys.exit(result)

run('migrate')
run('createcachetable')
run('createsuperuser', '--noinput', env={
    'DJANGO_SUPERUSER_USERNAME': 'superuser',
    'DJANGO_SUPERUSER_PASSWORD': 'superuser',
    'DJANGO_SUPERUSER_EMAIL': 'superuser@example.com',
})
print('dev environment ready - log in as superuser / superuser')
"""


[tool.poe.tasks.dev-clean]
help = "Remove the dev settings files and sqlite database, leaving nothing behind"
interpreter = "python"
shell = """
import pathlib

for path in [
    'qatrack/local_settings.py',
    'qatrack/local_test_settings.py',
    'qatrack/local_test_settings.memory.py',
    'db/default.db',
]:
    target = pathlib.Path(path)
    if target.exists():
        target.unlink()
        print(f'removed {path}')
"""


[tool.poe.tasks.dev-reset]
help = "DESTRUCTIVE: delete your dev settings and sqlite database, then set up a fresh one"
sequence = ["dev-clean", "dev-init"]


[tool.poe.tasks.run]
help = "Run the dev server"
cmd = "python ./manage.py runserver"

# ==========================================================================
# Tests
# ==========================================================================


[tool.poe.tasks.test]
help = "Run the suite (GUI/Selenium tests skipped by default - pass --run-selenium to include them)"
cmd = "pytest"


[[tool.poe.tasks.test-engine.args]]
name = "engine"
positional = true
required = true
help = "sqlite, memory, postgres, mysql or mssql"


[tool.poe.tasks.test-engine]
help = "Run the suite against one engine, restoring your settings afterwards"
interpreter = "python"
shell = """
import os, pathlib, shutil, subprocess, sys

# poe passes declared task args to a `shell` task as environment
# variables. `${engine}` is NOT substituted inside a python-interpreter
# body - it arrives literally - so read it from the environment.
engine = os.environ['engine']
src = pathlib.Path(f'qatrack/local_test_settings.{engine}.py')
live = pathlib.Path('qatrack/local_test_settings.py')
backup = pathlib.Path('qatrack/local_test_settings.py.bak')

if not src.exists():
    print(f'error: {src} not found.')
    print(f'Create it first - see deploy/dev/local_test_settings.{engine}.py '
          'for a starting template.')
    sys.exit(1)

# try/finally rather than the shell version's fall-through restore. The
# Makefile/`_test-engine` form only restores if the pytest line completes;
# interrupt it (Ctrl-C) and your real local_test_settings.py is left
# swapped out. This restores on any exit, including KeyboardInterrupt.
had_existing = live.exists()
if had_existing:
    shutil.copyfile(live, backup)
shutil.copyfile(src, live)
try:
    status = subprocess.call([sys.executable, '-m', 'pytest'])
finally:
    if had_existing:
        shutil.move(str(backup), str(live))
    else:
        live.unlink(missing_ok=True)
sys.exit(status)
"""


[tool.poe.tasks.test-integration]
help = "Provision a fresh sqlite db like a real deployment, then run the suite against it"
interpreter = "python"
shell = """
import os, pathlib, shutil, subprocess, sys

DB = pathlib.Path('db/default.db')
DB_BAK = pathlib.Path('db/default.db.bak')
KEPT = pathlib.Path('db/pytest_default.db')
LIVE = pathlib.Path('qatrack/local_test_settings.py')
LIVE_BAK = pathlib.Path('qatrack/local_test_settings.py.bak')

pathlib.Path('db').mkdir(exist_ok=True)


def manage(*args, env=None):
    code = subprocess.call([sys.executable, 'manage.py', *args],
                           env={**os.environ, **(env or {})})
    if code != 0:
        raise SystemExit(code)


# Move the developer's real database and settings aside. The shell version
# of this task does the same, but restores by falling through to its last
# few lines - so if provisioning fails, or the run is interrupted, the
# developer is left with their dev database sitting at db/default.db.bak
# and no db/default.db at all. Everything below is wrapped so the restore
# happens on any exit.
had_db = DB.exists()
had_live = LIVE.exists()
if had_db:
    shutil.move(str(DB), str(DB_BAK))
if had_live:
    shutil.copyfile(LIVE, LIVE_BAK)
shutil.copyfile('deploy/dev/local_test_settings.sqlite.py', LIVE)

status = 1
try:
    # Provision exactly the way a fresh deployment would, so the whole
    # sequence is exercised for real and not just a disposable test db.
    manage('migrate')
    manage('createcachetable')
    manage('collectstatic', '--noinput')
    manage('createsuperuser', '--noinput', env={
        'DJANGO_SUPERUSER_USERNAME': 'superuser',
        'DJANGO_SUPERUSER_PASSWORD': 'superuser',
        'DJANGO_SUPERUSER_EMAIL': 'superuser@example.com',
    })
    status = subprocess.call([sys.executable, '-m', 'pytest', '--reuse-db'])
finally:
    # Keep the provisioned db for inspection, but only if it exists - the
    # shell version runs its `mv` unconditionally and errors when
    # provisioning failed before the database was created.
    if DB.exists():
        KEPT.unlink(missing_ok=True)
        shutil.move(str(DB), str(KEPT))
        print(f'provisioned database kept at {KEPT}')
    if had_live:
        shutil.move(str(LIVE_BAK), str(LIVE))
    else:
        LIVE.unlink(missing_ok=True)
    if had_db:
        shutil.move(str(DB_BAK), str(DB))
        print(f'restored your {DB}')

sys.exit(status)
"""

# ==========================================================================
# Tests - browser / GUI
# ==========================================================================


# GUI/Selenium only. Both axes - browser and window - are named in full on
# every task, because neither has a "real" option and a deviation: Chromium
# finds timing races Firefox does not, and a visible window is how you debug
# them. Naming one combination shorter than the others would imply a pecking
# order that does not exist.
#
# `test-gui` is not a fifth combination - it deliberately sets nothing, so it
# runs whatever your own settings configure.
#
# Plain tasks rather than one with a --browser argument: poe stops forwarding
# dash-prefixed tokens as soon as a task declares a named arg (see the note on
# _test-engine below), and `-k`, `-x` and `--pdb` are exactly what you reach
# for on a failing browser test.
#
# The env tables are the reason these exist - `SELENIUM_BROWSER=chromium
# pytest ...` is not something you can type in cmd or PowerShell, and Windows
# is a large share of real deployments.
#
# Note these set environment variables, and qatrack/local_test_settings.py is
# imported after settings.py has read them. If you uncomment SELENIUM_BROWSER
# or SELENIUM_HEADLESS there, your file wins and these tasks stop having any
# effect - which looks exactly like the task being broken.

[tool.poe.tasks.test-gui]
help = "Run ONLY the GUI/Selenium tests, using whatever your settings configure"
cmd = "pytest -m selenium"


[tool.poe.tasks.test-gui-firefox-headless]
help = "Run ONLY the GUI/Selenium tests: firefox, no window (no display needed)"
cmd = "pytest -m selenium"
env = { SELENIUM_BROWSER = "firefox", SELENIUM_HEADLESS = "True" }


[tool.poe.tasks.test-gui-firefox-visible]
help = "Run ONLY the GUI/Selenium tests: firefox, visible window (needs a display)"
cmd = "pytest -m selenium"
env = { SELENIUM_BROWSER = "firefox", SELENIUM_HEADLESS = "False" }


[tool.poe.tasks.test-gui-chromium-headless]
help = "Run ONLY the GUI/Selenium tests: chromium, no window (no display needed)"
cmd = "pytest -m selenium"
env = { SELENIUM_BROWSER = "chromium", SELENIUM_HEADLESS = "True" }


[tool.poe.tasks.test-gui-chromium-visible]
help = "Run ONLY the GUI/Selenium tests: chromium, visible window (needs a display)"
cmd = "pytest -m selenium"
env = { SELENIUM_BROWSER = "chromium", SELENIUM_HEADLESS = "False" }

# ==========================================================================
# Coverage
# ==========================================================================


[tool.poe.tasks.cover]
help = "Run the full suite with coverage (--reuse-db)"
cmd = "pytest --reuse-db --cov-report term-missing --cov ./"


[tool.poe.tasks.cover-qatrack]
help = "Like cover, but scoped to the qatrack package only"
cmd = "pytest --reuse-db --cov-report term-missing --cov qatrack"


[[tool.poe.tasks.cover-module.args]]
name = "module"
positional = true
required = true
# A path, not a dotted module. The command interpolates it into both
# `--cov ./${module}` and pytest's target, and pytest takes paths - given
# qatrack.qa it collects nothing, reports no coverage and exits 4, which
# looks far too much like a module with no tests.
help = "qatrack/qa, qatrack/units, or any path under qatrack/"


[tool.poe.tasks.cover-module]
help = "Run coverage for a single module, e.g. `poe cover-module qatrack/qa`"
cmd = "pytest --cov-report term-missing --cov ./${module} ${module}"

# ==========================================================================
# Documentation
# ==========================================================================


# ===========================================================================
# `next-*` tasks - the cross-platform successors
# ===========================================================================
#
# Everything above this point mirrors a Makefile target one-for-one, and is
# meant to keep doing so while Make is still the primary runner. Do not
# change those to gain portability; changing them breaks the mirror, which
# is the only thing making the two runners comparable.
#
# These `next-*` tasks are the replacements, written the way the tasks would
# have to be written if Make were retired. The prefix is deliberate: it
# marks them as the intended future, not an alternative flavour. When Make
# goes, these lose the prefix and replace their mirrored counterparts; until
# then both exist side by side and the `next-` name says which one is going
# to win.
#
# They have no Makefile counterpart on purpose. The point of them is to work
# where Make does not - a Windows host with no `make` at all - so mirroring
# them back into the Makefile would defeat the exercise.
#
# Why Python rather than PowerShell, having tried both: poe runs `pwsh`
# tasks as `pwsh -NoLogo -Command -`, piping the body in on stdin (see
# poethepoet/task/shell.py). Verified against pwsh 7.6.6: that invocation
# runs flat multi-line scripts and single-line brace blocks, but a
# *multi-line* brace block - any real `if`, `foreach` or `try` - silently
# executes nothing at all and exits 0. The same script via `pwsh -File`
# runs fine, but poe does not use -File. Every task below needs a
# conditional or a loop, so a PowerShell body would have to be written as
# single-line-with-semicolons to work, which is not reviewable. Python is
# also one body instead of two, with no platform switch to keep in sync.
#
# Shell support: bash on Linux/macOS, pwsh on Windows. cmd.exe is
# deliberately NOT supported - a project decision, not an oversight. Tasks
# that genuinely need a shell therefore declare an explicit `interpreter`
# and may assume ordinary shell syntax.
#
# Current shell situation, so it stays honest as tasks are added:
#
#   * `cmd` tasks (no shell at all): test, test_simple, cover*, run,
#     clearct, flushdb, schema, cleardb, next-docs.
#   * `interpreter = "python"`: every other next-* task.
#   * POSIX-shell-only, each of which HAS a next-* successor:
#     dev-quickstart, _test-engine, test-integration, dumpdata, docs.
#   * POSIX-shell-only and deliberately so: nginx-conf, supervisor-conf.
#     They shell out to sudo to install nginx/supervisor configs, so there
#     is no meaningful Windows equivalent to write.
#
# In other words, every task that cannot run on Windows today either has a
# next-* replacement or is Ubuntu-only by nature. If you add a task that
# needs a shell, give it an explicit interpreter or a next-* counterpart.
#
# NOTE: verified on Linux only. The Python bodies use nothing
# platform-specific (pathlib, shutil, subprocess, sys.executable), but
# nobody has run these on Windows yet - that is the remaining task before
# anyone relies on them.

[tool.poe.tasks.docs]
help = "Build the Sphinx docs (output under docs/_build/html)"
# `docs` above runs `cd docs && make html`, which needs Make on the host -
# precisely what a Windows contributor does not have. Calling sphinx-build
# directly needs neither Make nor docs/make.bat.
cmd = "sphinx-build -b html docs docs/_build/html"


[[tool.poe.tasks.docs-autobuild.args]]
name = "port"
options = ["--port"]
default = "8008"


[tool.poe.tasks.docs-autobuild]
help = "Serve the docs locally with live-reload, default port 8008 (poe docs-autobuild --port 8010 to override)"
