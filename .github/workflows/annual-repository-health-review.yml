name: Annual Repository Health Review

on:
  schedule:
    # Runs once a year on Jan 15 at 09:00 UTC.
    - cron: '0 9 15 1 *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  annual-review:
    name: Annual repository health analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Run annual repository health review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: ${{ vars.ANNUAL_HEALTH_AI_MODEL || 'gpt-4.1-mini' }}
          AI_API_URL: ${{ vars.ANNUAL_HEALTH_AI_API_URL || 'https://models.inference.ai.azure.com/chat/completions' }}
        run: python .github/scripts/annual_repository_health_review.py
