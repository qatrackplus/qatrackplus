name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pre-Commit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
      - name: Setup Database configuration
        run: cp deploy/sqlite/local_settings.py qatrack/local_settings.py
      - name: Run pre-commit
        run: uvx pre-commit run --all-files

  requirements:
    name: Requirements Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install system dependencies for python-ldap
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Check dependencies
        run: uv pip check

  linux-tests:
    name: Linux Tests
    runs-on: ubuntu-latest
    needs: [lint, requirements]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        db: [sqlite, postgres, mysql]
    
    services:
      postgres:
        image: postgres@sha256:1b92e7a80c021647bf70f5d3eb66066a998e4f5cf43c07bb9dc9f729782cf88e
        env:
          POSTGRES_DB: qatrackplus
          POSTGRES_USER: qatrack
          POSTGRES_PASSWORD: qatrackpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (SQLite)
        if: matrix.db == 'sqlite'
        run: uv sync

      - name: Install dependencies (Postgres)
        if: matrix.db == 'postgres'
        run: |
          sudo apt-get update && sudo apt-get install -y libpq-dev
          uv sync --extra postgres

      - name: Install dependencies (MySQL)
        if: matrix.db == 'mysql'
        run: |
          sudo apt-get update && sudo apt-get install -y libmysqlclient-dev
          uv sync --extra mysql

      - name: Setup Database configuration (SQLite)
        if: matrix.db == 'sqlite'
        run: cp deploy/sqlite/local_settings.py qatrack/local_settings.py

      - name: Setup Database configuration (Postgres)
        if: matrix.db == 'postgres'
        run: |
          cp deploy/postgres/local_settings.py qatrack/local_settings.py
          sed -i "s/'HOST': ''/'HOST': '127.0.0.1'/g" qatrack/local_settings.py
          # User qatrack is already created with full privileges by the service container

      - name: Setup Database configuration (MySQL)
        if: matrix.db == 'mysql'
        run: |
          cp deploy/mysql/local_settings.py qatrack/local_settings.py
          sed -i "s/'HOST': ''/'HOST': '127.0.0.1'/g" qatrack/local_settings.py
          # Setup mysql users and privileges for MySQL 8 compat
          docker exec -i ${{ job.services.mysql.id }} mysql -u root -proot -e "CREATE USER 'qatrack'@'%' IDENTIFIED WITH mysql_native_password BY 'qatrackpass'; CREATE USER 'qatrack_reports'@'%' IDENTIFIED WITH mysql_native_password BY 'qatrackpass'; CREATE DATABASE qatrackplus CHARACTER SET utf8mb4; GRANT ALL ON qatrackplus.* TO 'qatrack'@'%'; GRANT ALL ON test_qatrackplus.* TO 'qatrack'@'%'; GRANT SELECT ON qatrackplus.* TO 'qatrack_reports'@'%'; FLUSH PRIVILEGES;"
          docker exec -i ${{ job.services.mysql.id }} sh -c "mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -u root -proot mysql"

      - name: Point the tests at the job's database
        if: matrix.db != 'sqlite'
        # test_settings.py pins in-memory SQLite unless local_test_settings.py says otherwise;
        # without this step the postgres and mysql jobs test SQLite. Fails if they still would.
        run: uv run python scripts/ci_test_database.py

      - name: Run Tests
        run: uv run pytest -x -m "not selenium"

  windows-tests:
    name: Windows Tests
    runs-on: windows-latest
    needs: [lint, requirements]
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mssql]
    
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
          python-version: "3.12"
          
      - name: Install dependencies (SQLite)
        if: matrix.db == 'sqlite'
        run: uv sync --extra win
        
      - name: Install dependencies (MSSQL)
        if: matrix.db == 'mssql'
        run: uv sync --extra win --extra mssql
        
      - name: Setup Database configuration (SQLite)
        if: matrix.db == 'sqlite'
        run: copy deploy\sqlite\local_settings.py qatrack\local_settings.py
        
      - name: Setup Database configuration (MSSQL)
        if: matrix.db == 'mssql'
        uses: Particular/install-sql-server-action@669fc7147c13cb314685bab823a55a5e22a0c95f
        with:
          catalog: qatrackplus
          connection-string-env-var: SQL_CONNECTION_STRING

      - name: Configure MSSQL local_settings.py
        if: matrix.db == 'mssql'
        run: |
          $code = @"
          import os
          conn_str = os.environ.get('SQL_CONNECTION_STRING', '')
          parts = dict(part.split('=', 1) for part in conn_str.split(';') if '=' in part)
          db_settings = {
              'ENGINE': 'mssql',
              'NAME': parts.get('Database', parts.get('Initial Catalog', 'qatrackplus')),
              'HOST': parts.get('Server', parts.get('Data Source', r'localhost\SQLEXPRESS')),
              'PORT': '',
              'OPTIONS': {
                  'driver': 'ODBC Driver 17 for SQL Server',
              },
          }
          if 'User Id' in parts and 'Password' in parts:
              db_settings['USER'] = parts['User Id']
              db_settings['PASSWORD'] = parts['Password']
          elif 'Uid' in parts and 'Pwd' in parts:
              db_settings['USER'] = parts['Uid']
              db_settings['PASSWORD'] = parts['Pwd']
          else:
              db_settings['OPTIONS']['extra_params'] = 'Trusted_Connection=yes'
          with open('qatrack/local_settings.py', 'w', encoding='utf8') as f:
              f.write('DEBUG = False\n')
              f.write('DATABASES = { "default": ' + repr(db_settings) + ' }\n')
              f.write('DATABASES["readonly"] = DATABASES["default"]\n')
          "@
          $code | Out-File -FilePath generate_settings.py -Encoding utf8
          python generate_settings.py

      - name: Run Tests
        run: uv run pytest -x -m "not selenium"

  docker-check:
    name: Docker Build & Run Check
    runs-on: ubuntu-latest
    needs: [lint, requirements]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Check build context and line endings
        run: bash .github/scripts/check-docker-build-context.sh

      - name: Set up Docker Compose
        run: sudo apt-get update && sudo apt-get install docker-compose -y

      - name: Build Docker Images
        working-directory: deploy/docker
        run: |
          cp .env.example .env
          docker compose -f compose.yaml build

      - name: Fix script permissions
        run: chmod +x deploy/docker/django/entrypoint.sh

      - name: Start Docker Containers
        working-directory: deploy/docker
        run: docker compose -f compose.yaml up -d

      - name: Check Running Containers
        run: |
          docker ps -a
          # Optionally sleep for a few seconds to ensure containers don't immediately crash
          sleep 10
          
      - name: Check Container Logs for Errors (Optional)
        working-directory: deploy/docker
        run: docker compose -f compose.yaml logs

      - name: Verify Application is Up (Optional health check)
        # Check if the Django app container remains 'Up' and didn't exit or become unhealthy
        run: |
          if [ $(docker ps -q -f status=exited | wc -l) -gt 0 ]; then
            echo "One or more containers exited unexpectedly!"
            docker ps -a
            exit 1
          fi
          if [ $(docker ps -q -f health=unhealthy | wc -l) -gt 0 ]; then
            echo "One or more containers are unhealthy!"
            docker ps -a
            exit 1
          fi

      - name: Verify backup produces a valid dump
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          docker compose -f compose.yaml exec -T backup sh -eu -c '
            rm -f /backups/db_*.dump /backups/media_*.tar.gz 2>/dev/null || true

            # Run the backup exactly as the nightly cron job does.
            /usr/local/bin/backup

            dump=$(ls -1t /backups/db_*.dump 2>/dev/null | head -1 || true)
            [ -n "$dump" ] || { echo "FAIL: no db dump produced"; exit 1; }

            size=$(stat -c %s "$dump")
            echo "dump=$dump size=$size"
            [ "$size" -gt 0 ] || { echo "FAIL: db dump is 0 bytes (auth failed)"; exit 1; }

            # Prove it is a real pg_dump archive, not just non-empty.
            pg_restore --list "$dump" >/dev/null || { echo "FAIL: not a valid archive"; exit 1; }

            # Media archive must also be produced.
            ls -1 /backups/media_*.tar.gz >/dev/null || { echo "FAIL: media archive missing"; exit 1; }

            echo "PASS: valid db dump + media archive produced"
          '

      - name: HTTP smoke test
        # The checks above prove the containers start and stay healthy, and
        # that the backup service produces a real archive. They do not prove
        # the deployment is wired together: nginx could be serving nothing, or
        # serving it from the wrong place, with every container still "Up".
        # This hits it the way a client does - through nginx on its published
        # port, not an internal healthcheck.
        working-directory: deploy/docker
        run: |
          set -euo pipefail

          # nginx serves only its configured server_name, which
          # 10-set-env-var-defaults.envsh derives from ALLOWED_HOSTS, so every
          # request has to carry a matching Host header. Read it from .env
          # rather than hard-coding, so this keeps working if the example file
          # changes its hostname.
          host=$(grep -E '^ALLOWED_HOSTS=' .env | cut -d= -f2- | cut -d, -f1)
          echo "testing against Host: $host"

          # `/` must be the application's own redirect to its login page.
          # "anything under 500" was the old test, and it passes for a default
          # nginx welcome page, for a 404, and for any redirect to anywhere -
          # none of which mean QATrack+ is being served. Raised by Copilot and
          # CodeRabbit both.
          # curl's own fields rather than parsing the headers: `awk
          # IGNORECASE` is a gawk extension and Ubuntu's awk is mawk, so a
          # header-matching version of this silently found no Location at all.
          #
          # Two requests rather than one with a heredoc: a heredoc terminator
          # has to sit at column 1, which ends the YAML block scalar this step
          # is written in and makes the file unparseable.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $host" http://localhost/)
          redirect=$(curl -s -o /dev/null -w '%{redirect_url}' -H "Host: $host" http://localhost/)
          [ "$code" = "302" ] || { echo "FAIL: / returned $code, expected 302"; exit 1; }
          case "$redirect" in
            */accounts/login/*) echo "PASS: / redirects to $redirect" ;;
            *) echo "FAIL: / redirected to '$redirect', expected /accounts/login/..."; exit 1 ;;
          esac

          # And the login page is QATrack+'s own, not an error page that
          # happens to answer 200. The CSRF field is in the form, and the
          # title is built by QATrack+'s base template.
          login=$(curl -s -H "Host: $host" http://localhost/accounts/login/)
          echo "$login" | grep -q "csrfmiddlewaretoken" \
            || { echo "FAIL: no CSRF field on the login page"; exit 1; }
          echo "$login" | grep -qi "log in" \
            || { echo "FAIL: the login page does not look like QATrack+'s"; exit 1; }
          echo "PASS: the login page is served and carries a CSRF token"

          # The media and static locations reach the volumes django writes to.
          # The old test accepted any status under 500 for /media/ and /static/,
          # which a missing alias answers 404 to and a removed location answers
          # with Django's login redirect - both passes. A file written through
          # django's mount and read back byte for byte through nginx is the
          # thing actually worth asserting.
          marker="ci-smoke-$GITHUB_RUN_ID-$RANDOM"
          docker compose -f compose.yaml exec -T django sh -c \
            "printf %s '$marker' > /app_data/media/ci-smoke.txt; printf %s '$marker' > /app_data/static/ci-smoke.txt"
          for path in /media/ci-smoke.txt /static/ci-smoke.txt; do
            got=$(curl -s -H "Host: $host" "http://localhost$path")
            [ "$got" = "$marker" ] || {
              echo "FAIL: $path returned '$got', expected '$marker'"; exit 1; }
            echo "PASS: $path is served from django's own volume"
          done
          docker compose -f compose.yaml exec -T django \
            rm -f /app_data/media/ci-smoke.txt /app_data/static/ci-smoke.txt

          # An unknown Host is not served. nginx refuses it with its 444,
          # closing the connection without a response, so curl exits non-zero
          # and reports no status at all - hence testing the exit code rather
          # than comparing a number. Django's own ALLOWED_HOSTS check would
          # answer 400, but nginx never lets the request that far, which is
          # the defence worth asserting here.
          if curl -sS -o /dev/null --max-time 10 -H 'Host: evil.example.com' http://localhost/ 2>/dev/null; then
            echo "FAIL: an unknown Host header was served"
            exit 1
          fi
          echo "PASS: an unknown Host header is refused by nginx"

      - name: Tear Down
        if: always()
        working-directory: deploy/docker
        run: docker compose -f compose.yaml down -v