name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pre-Commit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
      - name: Setup Database configuration
        run: cp deploy/sqlite/local_settings.py qatrack/local_settings.py
      - name: Run pre-commit
        run: uvx pre-commit run --all-files

  requirements:
    name: Requirements Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install system dependencies for python-ldap
        run: sudo apt-get update && sudo apt-get install -y libldap2-dev libsasl2-dev
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-extras
      - name: Check dependencies
        run: uv pip check

  linux-tests:
    name: Linux Tests
    runs-on: ubuntu-latest
    needs: [lint, requirements]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        db: [sqlite, postgres, mysql]
    
    services:
      postgres:
        image: postgres@sha256:1b92e7a80c021647bf70f5d3eb66066a998e4f5cf43c07bb9dc9f729782cf88e
        env:
          POSTGRES_DB: qatrackplus
          POSTGRES_USER: qatrack
          POSTGRES_PASSWORD: qatrackpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (SQLite)
        if: matrix.db == 'sqlite'
        run: uv sync

      - name: Install dependencies (Postgres)
        if: matrix.db == 'postgres'
        run: |
          sudo apt-get update && sudo apt-get install -y libpq-dev
          uv sync --extra postgres

      - name: Install dependencies (MySQL)
        if: matrix.db == 'mysql'
        run: |
          sudo apt-get update && sudo apt-get install -y libmysqlclient-dev
          uv sync --extra mysql

      - name: Setup Database configuration (SQLite)
        if: matrix.db == 'sqlite'
        run: cp deploy/sqlite/local_settings.py qatrack/local_settings.py

      - name: Setup Database configuration (Postgres)
        if: matrix.db == 'postgres'
        run: |
          cp deploy/postgres/local_settings.py qatrack/local_settings.py
          sed -i "s/'HOST': ''/'HOST': '127.0.0.1'/g" qatrack/local_settings.py
          # User qatrack is already created with full privileges by the service container

      - name: Setup Database configuration (MySQL)
        if: matrix.db == 'mysql'
        run: |
          cp deploy/mysql/local_settings.py qatrack/local_settings.py
          sed -i "s/'HOST': ''/'HOST': '127.0.0.1'/g" qatrack/local_settings.py
          # Setup mysql users and privileges for MySQL 8 compat
          docker exec -i ${{ job.services.mysql.id }} mysql -u root -proot -e "CREATE USER 'qatrack'@'%' IDENTIFIED WITH mysql_native_password BY 'qatrackpass'; CREATE USER 'qatrack_reports'@'%' IDENTIFIED WITH mysql_native_password BY 'qatrackpass'; CREATE DATABASE qatrackplus CHARACTER SET utf8mb4; GRANT ALL ON qatrackplus.* TO 'qatrack'@'%'; GRANT ALL ON test_qatrackplus.* TO 'qatrack'@'%'; GRANT SELECT ON qatrackplus.* TO 'qatrack_reports'@'%'; FLUSH PRIVILEGES;"
          docker exec -i ${{ job.services.mysql.id }} sh -c "mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -u root -proot mysql"

      - name: Run Tests
        run: uv run pytest -x -m "not selenium"

  windows-tests:
    name: Windows Tests
    runs-on: windows-latest
    needs: [lint, requirements]
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mssql]
    
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      
      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          enable-cache: true
          python-version: "3.12"
          
      - name: Install dependencies (SQLite)
        if: matrix.db == 'sqlite'
        run: uv sync --extra win
        
      - name: Install dependencies (MSSQL)
        if: matrix.db == 'mssql'
        run: uv sync --extra win --extra mssql
        
      - name: Setup Database configuration (SQLite)
        if: matrix.db == 'sqlite'
        run: copy deploy\sqlite\local_settings.py qatrack\local_settings.py
        
      - name: Setup Database configuration (MSSQL)
        if: matrix.db == 'mssql'
        uses: Particular/install-sql-server-action@669fc7147c13cb314685bab823a55a5e22a0c95f
        with:
          catalog: qatrackplus
          connection-string-env-var: SQL_CONNECTION_STRING

      - name: Configure MSSQL local_settings.py
        if: matrix.db == 'mssql'
        run: |
          $code = @"
          import os
          conn_str = os.environ.get('SQL_CONNECTION_STRING', '')
          parts = dict(part.split('=', 1) for part in conn_str.split(';') if '=' in part)
          db_settings = {
              'ENGINE': 'mssql',
              'NAME': parts.get('Database', parts.get('Initial Catalog', 'qatrackplus')),
              'HOST': parts.get('Server', parts.get('Data Source', r'localhost\SQLEXPRESS')),
              'PORT': '',
              'OPTIONS': {
                  'driver': 'ODBC Driver 17 for SQL Server',
              },
          }
          if 'User Id' in parts and 'Password' in parts:
              db_settings['USER'] = parts['User Id']
              db_settings['PASSWORD'] = parts['Password']
          elif 'Uid' in parts and 'Pwd' in parts:
              db_settings['USER'] = parts['Uid']
              db_settings['PASSWORD'] = parts['Pwd']
          else:
              db_settings['OPTIONS']['extra_params'] = 'Trusted_Connection=yes'
          with open('qatrack/local_settings.py', 'w', encoding='utf8') as f:
              f.write('DEBUG = False\n')
              f.write('DATABASES = { "default": ' + repr(db_settings) + ' }\n')
              f.write('DATABASES["readonly"] = DATABASES["default"]\n')
          "@
          $code | Out-File -FilePath generate_settings.py -Encoding utf8
          python generate_settings.py
      - name: Run Tests
        run: uv run pytest -x -m "not selenium"

  docker-check:
    name: Docker Build & Run Check
    runs-on: ubuntu-24.04
    needs: [lint, requirements]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Check build context and line endings
        run: bash .github/scripts/check-docker-build-context.sh

      - name: Set up Docker Compose
        run: sudo apt-get update && sudo apt-get install docker-compose -y

      - name: Plain docker compose uses only compose.yaml
        # The docs tell sites to run plain `docker compose`. An automatically
        # applied compose.override.yaml would change what that runs: the old one
        # mounted the checkout over the image's code.
        working-directory: deploy/docker
        run: test ! -e compose.override.yaml

      - name: Build Docker Images
        working-directory: deploy/docker
        run: |
          cp .env.example .env
          # A real host name, so nginx's host filtering is exercised.
          sed -i 's/^ALLOWED_HOSTS=.*/ALLOWED_HOSTS=qatrack.test/' .env
          docker compose build

      - name: Fix script permissions
        run: chmod +x deploy/docker/django/entrypoint.sh

      - name: Start Docker Containers
        working-directory: deploy/docker
        run: docker compose up -d --wait --wait-timeout 300

      - name: Check Running Containers
        run: docker ps -a

      - name: Check Container Logs for Errors (Optional)
        if: always()
        working-directory: deploy/docker
        run: docker compose logs

      - name: Verify Application is Up (Optional health check)
        # Check that no container exited or became unhealthy. The one-shot init
        # service is expected to exit, and must have exited 0.
        working-directory: deploy/docker
        run: |
          init_id=$(docker compose ps -aq init)
          init_code=$(docker inspect -f '{{.State.ExitCode}}' "$init_id")
          if [ "$init_code" != 0 ]; then
            echo "The init service exited with $init_code"
            docker compose logs init
            exit 1
          fi
          if [ $(docker ps -q -f status=exited | grep -v "^${init_id:0:12}" | wc -l) -gt 0 ]; then
            echo "One or more containers exited unexpectedly!"
            docker ps -a
            exit 1
          fi
          if [ $(docker ps -q -f health=unhealthy | wc -l) -gt 0 ]; then
            echo "One or more containers are unhealthy!"
            docker ps -a
            exit 1
          fi

      - name: Verify the application runs unprivileged
        working-directory: deploy/docker
        run: |
          uid=$(docker compose exec -T django stat -c %u /proc/1)
          echo "django server process uid: $uid"
          [ "$uid" = 1000 ]
          # Nothing the app needs (Matplotlib's cache, for one) may be unwritable.
          if docker compose logs django 2>&1 | grep -E "Permission denied|mkdir -p failed"; then
            echo "::error::django logged a permission error"
            exit 1
          fi

      - name: Verify background tasks run (django-q)
        working-directory: deploy/docker
        run: |
          # Queue a task from the app and wait for the django-q service to run it.
          docker compose exec -T django python manage.py shell -c "
          from django_q.tasks import async_task, result
          task = async_task('math.floor', 2.5)
          value = result(task, wait=60000)
          print('django-q ran task', task, '->', value)
          assert value == 2, value
          "

      - name: Verify nginx answers only ALLOWED_HOSTS, accepts large uploads, and logs are capped
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: qatrack.test' http://127.0.0.1/accounts/login/)
          echo "qatrack.test: $code"
          [ "$code" = 200 ]
          # Any other host is closed without an answer (curl: empty reply, exit 52).
          rc=0
          curl -s -o /dev/null -H 'Host: other.test' http://127.0.0.1/ || rc=$?
          echo "other.test: curl exit $rc"
          [ "$rc" = 52 ]
          # A 5 MB upload reaches QATrack+ (403, no CSRF token) instead of nginx's 413.
          code=$(head -c 5000000 /dev/zero | curl -s -o /dev/null -w '%{http_code}' -H 'Host: qatrack.test' \
            -H 'Content-Type: application/octet-stream' --data-binary @- http://127.0.0.1/accounts/login/)
          echo "5 MB upload: $code"
          [ "$code" = 403 ]
          curl -fsS -o /dev/null -H 'Host: qatrack.test' http://127.0.0.1/static/qatrack_core/css/site.css
          for id in $(docker compose ps -aq); do
            size=$(docker inspect -f '{{index .HostConfig.LogConfig.Config "max-size"}}' "$id")
            echo "$(docker inspect -f '{{.Name}}' "$id"): max-size=$size"
            [ "$size" = 10m ]
          done

      - name: Verify LDAP support and that the secret key survives recreation
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          dc="docker compose"
          $dc exec -T django python -c "import ldap; print('python-ldap', ldap.__version__)"
          # .env.example sets no SECRET_KEY, so one was generated into the
          # user-data volume. Recreating the container must keep it.
          key_file=deploy/docker/user-data/secret_key.txt
          before=$($dc exec -T django sha256sum "$key_file")
          $dc up -d --force-recreate --wait --wait-timeout 300 django
          after=$($dc exec -T django sha256sum "$key_file")
          [ "$before" = "$after" ] || { echo "FAIL: secret key changed when django was recreated"; exit 1; }
          echo "PASS: secret key kept across recreation"

      - name: Verify HTTPS
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          mkdir -p user-data/ssl
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=qatrack.test \
            -keyout user-data/ssl/key.pem -out user-data/ssl/cert.pem
          echo "HTTP_OR_HTTPS=https" >> .env
          docker compose up -d --wait --wait-timeout 300
          r="--resolve qatrack.test:443:127.0.0.1"
          location=$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Host: qatrack.test' http://127.0.0.1/accounts/login/)
          echo "HTTP redirects to: $location"
          [ "$location" = "https://qatrack.test/accounts/login/" ]
          # Signing in over HTTPS passes the CSRF check: QATrack+ sees the request
          # as secure (X-Forwarded-Proto), so its secure cookies and origin match.
          # Wrong credentials redisplay the form (200); a CSRF failure is 403.
          jar=$(mktemp)
          curl -fsSk $r -c "$jar" -o /dev/null https://qatrack.test/accounts/login/
          token=$(awk '$6 == "csrftoken" {print $7}' "$jar")
          [ -n "$token" ]
          code=$(curl -sSk $r -b "$jar" -o /dev/null -w '%{http_code}' \
            -H 'Origin: https://qatrack.test' -H 'Referer: https://qatrack.test/accounts/login/' \
            --data-urlencode "csrfmiddlewaretoken=$token" --data-urlencode username=nobody --data-urlencode password=wrong \
            https://qatrack.test/accounts/login/)
          echo "sign-in POST over HTTPS: $code"
          [ "$code" = 200 ]
          # Other host names get no TLS handshake (curl exit 35).
          rc=0
          curl -sk --resolve other.test:443:127.0.0.1 -o /dev/null https://other.test/ || rc=$?
          echo "other.test over HTTPS: curl exit $rc"
          [ "$rc" = 35 ]

      - name: Verify backup produces a valid dump
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          docker compose exec -T backup sh -eu -c '
            rm -f /backups/db_*.dump /backups/media_*.tar.gz 2>/dev/null || true

            # Run the backup exactly as the nightly cron job does.
            bash /backup.sh

            dump=$(ls -1t /backups/db_*.dump 2>/dev/null | head -1 || true)
            [ -n "$dump" ] || { echo "FAIL: no db dump produced"; exit 1; }

            size=$(stat -c %s "$dump")
            echo "dump=$dump size=$size"
            [ "$size" -gt 0 ] || { echo "FAIL: db dump is 0 bytes (auth failed)"; exit 1; }

            # Prove it is a real pg_dump archive, not just non-empty.
            pg_restore --list "$dump" >/dev/null || { echo "FAIL: not a valid archive"; exit 1; }

            # Media archive must also be produced.
            ls -1 /backups/media_*.tar.gz >/dev/null || { echo "FAIL: media archive missing"; exit 1; }

            echo "PASS: valid db dump + media archive produced"
          '

      - name: Tear Down
        if: always()
        working-directory: deploy/docker
        run: docker compose down -v
  docker-upgrade:
    name: Docker Upgrade from 4.0.1
    runs-on: ubuntu-24.04
    needs: [lint, requirements]

    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Check out the 4.0.1 release alongside
        run: |
          git fetch --no-tags --depth 1 https://github.com/qatrackplus/qatrackplus.git refs/tags/v4.0.1:refs/tags/v4.0.1
          git worktree add ../base v4.0.1

      - name: Documented git steps keep a site's .env (docker_upgrade_from_4_0.rst)
        # 4.0.1 tracks deploy/docker/.env and every site has edited it. Follow
        # the documented commands, with `git checkout` of this commit standing
        # in for `git pull`.
        run: |
          set -euo pipefail
          site=$(mktemp -d)/qatrackplus
          git worktree add -q --detach "$site" v4.0.1
          cd "$site"
          echo "POSTGRES_PASSWORD=site-secret" >> deploy/docker/.env
          # Without the steps, git refuses, as the docs say.
          if git checkout -q "$GITHUB_SHA" 2>/dev/null; then
            echo "FAIL: expected git to refuse while .env has local edits"; exit 1
          fi
          cp deploy/docker/.env ../qatrack.env.backup
          git checkout -- deploy/docker/.env
          git checkout -q "$GITHUB_SHA"
          cp ../qatrack.env.backup deploy/docker/.env
          grep -qx "POSTGRES_PASSWORD=site-secret" deploy/docker/.env
          [ -z "$(git ls-files deploy/docker/.env)" ] || { echo "FAIL: .env still tracked"; exit 1; }
          [ -z "$(git status --porcelain)" ] || { git status; echo "FAIL: .env not ignored"; exit 1; }
          echo "PASS: site .env kept, untracked and ignored"

      - name: Start a 4.0.1 site
        working-directory: ../base/deploy/docker
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 300

      - name: Record 4.0.1 state and add data
        # 4.0.1 runs the server as root, so the files it writes to the shared
        # volumes are root-owned. This is what an upgrading site starts from.
        working-directory: ../base/deploy/docker
        run: |
          set -euo pipefail
          uid=$(docker compose exec -T django stat -c %u /proc/1)
          echo "4.0.1 django server process uid: $uid"
          [ "$uid" = 0 ]
          docker compose exec -T -e DJANGO_SUPERUSER_PASSWORD=ci-password-123 django \
            python manage.py createsuperuser --noinput --username ci --email ci@example.com
          docker compose exec -T django sh -c \
            'mkdir -p qatrack/media/uploads && echo "written by 4.0.1" > qatrack/media/uploads/ci-upgrade.txt'
          [ "$(docker compose exec -T django stat -c %u qatrack/static/admin)" = 0 ]
          [ "$(docker compose exec -T django stat -c %u qatrack/media/uploads/ci-upgrade.txt)" = 0 ]
          docker compose down

      - name: Upgrade to this branch on the same volumes
        working-directory: deploy/docker
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 300

      - name: Container logs
        if: always()
        working-directory: deploy/docker
        run: docker compose logs

      - name: Verify the upgraded site
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          dc="docker compose"
          [ "$(docker inspect -f '{{.State.ExitCode}}' "$($dc ps -aq init)")" = 0 ]
          [ $(docker ps -q -f health=unhealthy | wc -l) -eq 0 ]

          uid=$($dc exec -T django stat -c %u /proc/1)
          echo "upgraded django server process uid: $uid"
          [ "$uid" = 1000 ]

          # Data from 4.0.1 survived and is now owned by the app user.
          [ "$($dc exec -T django cat qatrack/media/uploads/ci-upgrade.txt)" = "written by 4.0.1" ]
          [ "$($dc exec -T django stat -c %u qatrack/media/uploads/ci-upgrade.txt)" = 1000 ]
          [ "$($dc exec -T django stat -c %u qatrack/static/admin)" = 1000 ]
          $dc exec -T django python manage.py shell -c \
            "import sys; from django.contrib.auth.models import User; sys.exit(not User.objects.filter(username='ci').exists())"

          # The commands users already run keep working, and write as the app user.
          $dc exec -T django touch qatrack/media/uploads/after-upgrade.txt
          [ "$($dc exec -T django stat -c %u qatrack/media/uploads/after-upgrade.txt)" = 1000 ]
          echo "PASS: 4.0.1 site upgraded; data intact and owned by the app user"

      - name: Tear Down
        if: always()
        working-directory: deploy/docker
        run: docker compose down -v

  docker-dev:
    name: Docker Development Overlay
    runs-on: ubuntu-24.04
    needs: [lint, requirements]

    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Start the stack from the checkout as the runner's own user
        # The runner's uid is not 1000, like many developers'. The app has to
        # write into the mounted checkout (logs/, site.css) as that user.
        working-directory: deploy/docker
        run: |
          cp .env.example .env
          echo "QATRACK_UID=$(id -u)" >> .env
          echo "QATRACK_GID=$(id -g)" >> .env
          echo "runner uid=$(id -u) gid=$(id -g)"
          docker compose -f compose.yaml -f compose.dev.yaml up -d --build --wait --wait-timeout 300

      - name: Container logs
        if: always()
        working-directory: deploy/docker
        run: docker compose -f compose.yaml -f compose.dev.yaml logs

      - name: Verify the app runs as the developer and writes into the checkout
        working-directory: deploy/docker
        run: |
          set -euo pipefail
          dc="docker compose -f compose.yaml -f compose.dev.yaml"
          [ "$(docker inspect -f '{{.State.ExitCode}}' "$($dc ps -aq init)")" = 0 ]
          uid=$($dc exec -T django stat -c %u /proc/1)
          echo "django server process uid: $uid"
          [ "$uid" = "$(id -u)" ]
          css="$GITHUB_WORKSPACE/qatrack/qatrack_core/static/qatrack_core/css/site.css"
          [ "$(stat -c %u "$css")" = "$(id -u)" ]
          ls -ln "$GITHUB_WORKSPACE/logs"
          [ -n "$(find "$GITHUB_WORKSPACE/logs" -type f -user "$(id -u)")" ]
          $dc exec -T django touch qatrack/media/uploads-dev-check.txt
          # Nothing the app needs (Matplotlib's cache, for one) may be unwritable.
          if $dc logs django 2>&1 | grep -E "Permission denied|mkdir -p failed"; then
            echo "::error::django logged a permission error"
            exit 1
          fi
          echo "PASS: dev overlay runs as uid $(id -u) and writes into the checkout"

      - name: Tear Down
        if: always()
        working-directory: deploy/docker
        run: docker compose -f compose.yaml -f compose.dev.yaml down -v
