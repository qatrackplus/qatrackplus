services:
  qatrack-postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=qatrack
      - POSTGRES_PASSWORD=qatrack
      - POSTGRES_DB=qatrackdb
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qatrack -d qatrackdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  qatrack-django:
    build:
      context: .
      dockerfile: deploy/docker/django/Dockerfile.dev
    volumes:
      - .:/usr/src/qatrackplus:rw
    environment:
      - DJANGO_SETTINGS_MODULE=qatrack.settings
      - PYTHONUNBUFFERED=1
      - POSTGRES_DB=qatrackdb
      - POSTGRES_USER=qatrack
      - POSTGRES_PASSWORD=qatrack
      - POSTGRES_HOST=qatrack-postgres
    ports:
      - "8000:8000"
    depends_on:
      qatrack-postgres:
        condition: service_healthy
    command: >
      /bin/bash -c "
      dos2unix deploy/docker/setup_dev.sh &&
      bash deploy/docker/setup_dev.sh &&
      gunicorn qatrack.wsgi:application -w 2 -b :8000 --reload
      "

  worker:
    build:
      context: .
      dockerfile: deploy/docker/django/Dockerfile.dev
    volumes:
      - .:/usr/src/qatrackplus:rw
    environment:
      - DJANGO_SETTINGS_MODULE=qatrack.settings
      - POSTGRES_DB=qatrackdb
      - POSTGRES_USER=qatrack
      - POSTGRES_PASSWORD=qatrack
      - POSTGRES_HOST=qatrack-postgres
    depends_on:
      qatrack-postgres:
        condition: service_healthy
    command: python manage.py qcluster

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./qatrack/static:/usr/src/qatrackplus/qatrack/static:ro
      - ./qatrack/media:/usr/src/qatrackplus/qatrack/media:rw
    ports:
      - "8080:80"
    depends_on:
      - qatrack-django

  test:
    build:
      context: .
      dockerfile: deploy/docker/django/Dockerfile.dev
    volumes:
      - .:/usr/src/qatrackplus:rw
    environment:
      - DJANGO_SETTINGS_MODULE=qatrack.settings
      - POSTGRES_DB=qatrackdb
      - POSTGRES_USER=qatrack
      - POSTGRES_PASSWORD=qatrack
      - POSTGRES_HOST=qatrack-postgres
    depends_on:
      qatrack-postgres:
        condition: service_healthy
    command: >
      /bin/bash -c "pytest -m 'not selenium'"
    profiles:
      - test

volumes:
  postgres_dev_data:
